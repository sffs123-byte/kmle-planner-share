<head>

<style>
:root {
  --ink: oklch(23% 0.028 251); --muted: oklch(42% 0.032 251);
  --paper: oklch(98% 0.008 82); --wash: oklch(94% 0.018 250);
  --line: oklch(84% 0.025 250); --blue: oklch(53% 0.18 256);
  --blue-dark: oklch(35% 0.13 256); --amber: oklch(79% 0.13 78);
  --green: oklch(57% 0.13 155); --red: oklch(58% 0.17 28);
  --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem;
  --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem;
  font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--paper); color: var(--ink); }
body { margin: 0; min-height: 100dvh; background:
  linear-gradient(90deg, transparent 0 4.5rem, color-mix(in oklch,var(--blue) 14%,transparent) 4.5rem 4.6rem, transparent 4.6rem),
  repeating-linear-gradient(0deg, transparent 0 31px, color-mix(in oklch,var(--line) 32%,transparent) 31px 32px), var(--paper); }
button, select { font: inherit; }
button { min-height: 44px; border: 0; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
.app { max-width: 1180px; margin: 0 auto; padding: max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom)); }
.masthead { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: var(--space-8); align-items: end; padding: var(--space-6) 0 var(--space-8); border-bottom: 2px solid var(--ink); }
.eyebrow { font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); }
h1 { margin: .35rem 0 0; font-size: clamp(2rem,5vw,4.4rem); line-height: .98; letter-spacing: -.055em; max-width: 13ch; }
.source-lock { text-align: right; font-size: .78rem; color: var(--muted); line-height: 1.55; }
.source-lock strong { color: var(--green); }
.progress-wrap { padding: var(--space-4) 0 var(--space-6); display: grid; grid-template-columns: 1fr auto; gap: .7rem 1rem; align-items: center; }
.progress-track { height: 8px; background: var(--wash); border-radius: 99px; overflow: hidden; }
.progress-bar { height: 100%; width: 0; background: var(--blue); transition: transform 180ms cubic-bezier(.25,1,.5,1), width 180ms cubic-bezier(.25,1,.5,1); }
.progress-text { font-size: .84rem; font-weight: 700; color: var(--blue-dark); font-variant-numeric: tabular-nums; }
.workspace { display: grid; grid-template-columns: 245px minmax(0,1fr); gap: clamp(1.5rem,4vw,4rem); align-items: start; }
.rail { position: sticky; top: 1rem; max-height: calc(100dvh - 2rem); overflow: auto; padding-right: .4rem; }
.rail h2 { margin: 0 0 .75rem; font-size: .82rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.chunk-list { display: grid; gap: 2px; }
.chunk-link { width: 100%; text-align: left; background: transparent; color: var(--muted); padding: .55rem .65rem; border-left: 3px solid transparent; font-size: .82rem; line-height: 1.25; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.chunk-link:hover { background: color-mix(in oklch,var(--wash) 68%,transparent); color: var(--ink); }
.chunk-link[aria-current="true"] { color: var(--blue-dark); border-left-color: var(--blue); background: color-mix(in oklch,var(--blue) 8%,transparent); font-weight: 800; }
.chunk-link.mastered::after { content: "✓"; float: right; color: var(--green); }
.stage { min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: var(--space-4); }
.mode { border: 1px solid var(--line); background: color-mix(in oklch,var(--paper) 88%,var(--wash)); color: var(--ink); border-radius: .35rem; padding: .55rem .75rem; min-height: 44px; }
.hotkeys { margin-left: auto; color: var(--muted); font-size: .78rem; }
.sheet { background: color-mix(in oklch,var(--paper) 95%,var(--wash)); border-top: 6px solid var(--blue); padding: clamp(1.2rem,4vw,3rem); min-height: 500px; box-shadow: 0 20px 55px color-mix(in oklch,var(--ink) 10%,transparent); }
.index-line { display: flex; gap: 1rem; align-items: baseline; color: var(--blue); font-weight: 900; letter-spacing: .06em; }
.index-line span:last-child { color: var(--muted); font-size: .82rem; font-weight: 700; letter-spacing: 0; }
h2#chunkLabel { margin: var(--space-4) 0 var(--space-8); font-size: clamp(1.3rem,3vw,2rem); line-height: 1.25; max-width: 30ch; }
.bridge { margin: 0 0 var(--space-8); padding: .8rem 0 .8rem 1rem; border-left: 2px solid var(--line); color: var(--muted); font-size: .9rem; }
.cue-label { font-size: .76rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); }
.cue { margin: .5rem 0 var(--space-8); font-size: clamp(1.4rem,4vw,2.65rem); line-height: 1.2; font-weight: 800; letter-spacing: -.03em; }
.answer-zone { min-height: 155px; border-top: 1px solid var(--line); padding-top: var(--space-6); }
.answer-placeholder { color: var(--muted); font-size: 1rem; }
.answer { display: none; font-size: clamp(1.05rem,2.4vw,1.35rem); line-height: 1.75; white-space: pre-wrap; max-width: 68ch; }
.answer.visible { display: block; animation: reveal 280ms cubic-bezier(.16,1,.3,1) both; }
@keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.actions { display: grid; grid-template-columns: auto 1fr auto auto; gap: .6rem; margin-top: var(--space-8); }
.btn { padding: .68rem 1rem; border-radius: .35rem; font-weight: 800; }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn-reveal { background: var(--blue); color: var(--paper); }
.btn-wrong { background: color-mix(in oklch,var(--red) 12%,var(--paper)); color: var(--red); }
.btn-right { background: var(--green); color: var(--paper); }
.mobile-nav { display: none; width: 100%; margin-bottom: 1rem; }
.status-note { margin-top: 1rem; color: var(--muted); font-size: .78rem; }
@media (max-width: 760px) {
  body { background-position-x: -3.2rem; }
  .masthead { grid-template-columns: 1fr; gap: 1rem; }
  .source-lock { text-align: left; }
  .workspace { grid-template-columns: 1fr; }
  .rail { display: none; }
  .mobile-nav { display: block; min-height: 48px; border: 1px solid var(--line); background: var(--paper); padding: .6rem; }
  .hotkeys { display: none; }
  .sheet { min-height: 0; }
  .answer-zone { min-height: 108px; }
  .actions { grid-template-columns: 1fr 1fr; }
  .btn-reveal { grid-column: 1 / -1; grid-row: 1; }
}
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
</style>

ext": "약물로 인해 지각, 결근(과제 제출, 성적 저하 / 집안일, 육아 방치)을 자주 하시나요? 약물로 인해 위험한 상황이나 다칠 뻔한 상황이 있었나요?, 약물로 인해 법적 문제에 휘말린 적이 있나요? 약물로 인해 대인 관계나 가족 내 갈등이 발생했나요?", "kind": "recitation"}, {"id": "H14", "section": "History taking", "source_line": 15, "source_row_part": 1, "label": "QoL · 일상 생활 지장", "cue": "약물로 인해 일상 생활에 지장이 많이 가나요", "previous_tail": "있나요? 약물로 인해 대인 관계나 가족 내 갈등이 발생했나요?", "exact_text": "약물로 인해 일상 생활에 지장이 많이 가나요?", "kind": "recitation"}, {"id": "H15", "section": "History taking", "source_line": 16, "source_row_part": 1, "label": "★ · 요약", "cue": "요약해보자면 ~~이네요. 맞나요", "previous_tail": "약물로 인해 일상 생활에 지장이 많이 가나요?", "exact_text": "요약해보자면 ~~이네요. 맞나요?", "kind": "recitation"}, {"id": "H16", "section": "History taking", "source_line": 17, "source_row_part": 1, "label": "A\n중독 · (개방형)", "cue": "다른 불편한 증상은 없으신가요", "previous_tail": "요약해보자면 ~~이네요. 맞나요?", "exact_text": "다른 불편한 증상은 없으신가요?", "kind": "recitation"}, {"id": "H17", "section": "History taking", "source_line": 18, "source_row_part": 1, "label": "전신 · 발열, 오한, 피로, 체중 변화, 부종", "cue": "열이 나거나 몸이 으슬으슬 떨리셨나요? 최근", "previous_tail": "다른 불편한 증상은 없으신가요?", "exact_text": "열이 나거나 몸이 으슬으슬 떨리셨나요? 최근 부쩍 피곤하거나 체중 변화가 있었나요?", "kind": "recitation"}, {"id": "H18", "section": "History taking", "source_line": 19, "source_row_part": 1, "label": "신경 · 구음장애, 보행장애, 경련, 의식저하,", "cue": "말이 어눌하거나 걷는게 불편하세요? 경련을", "previous_tail": "으슬 떨리셨나요? 최근 부쩍 피곤하거나 체중 변화가 있었나요?", "exact_text": "말이 어눌하거나 걷는게 불편하세요? 경련을 일으키거나 의식이 떨어진 적 있나요?", "kind": "recitation"}, {"id": "H19", "section": "History taking", "source_line": 20, "source_row_part": 1, "label": "정신 · 우울, 불안, 수면, 기억력/집중력, 환청/망상", "cue": "우울하거나 불안하진 않으세요? 잠을 잘 못", "previous_tail": "는게 불편하세요? 경련을 일으키거나 의식이 떨어진 적 있나요?", "exact_text": "우울하거나 불안하진 않으세요? 잠을 잘 못 주무시나요? 기억력이나 집중력이 떨어지셨나요? 헛것이 보이거나 들리진 않았나요?", "kind": "recitation"}, {"id": "H20", "section": "History taking", "source_line": 21, "source_row_part": 1, "label": "순환/호흡 · 가슴통증, 호흡곤란, 기침, 가래", "cue": "가슴 쪽이 아프세요? 숨이 잘 차거나 숨 쉬", "previous_tail": "이나 집중력이 떨어지셨나요? 헛것이 보이거나 들리진 않았나요?", "exact_text": "가슴 쪽이 아프세요? 숨이 잘 차거나 숨 쉬기 힘드세요? 기침이나 가래 있으세요?", "kind": "recitation"}, {"id": "H21", "section": "History taking", "source_line": 22, "source_row_part": 1, "label": "E · 이전 건강검진 이상 소견", "cue": "이전 건강검진에서 이상 소견 있었나요", "previous_tail": " 숨이 잘 차거나 숨 쉬기 힘드세요? 기침이나 가래 있으세요?", "exact_text": "이전 건강검진에서 이상 소견 있었나요?", "kind": "recitation"}, {"id": "H22", "section": "History taking", "source_line": 23, "source_row_part": 1, "label": "과 · (개방형)", "cue": "기존에 진단 받으신 질환 있으세요", "previous_tail": "이전 건강검진에서 이상 소견 있었나요?", "exact_text": "기존에 진단 받으신 질환 있으세요?", "kind": "recitation"}, {"id": "H23", "section": "History taking", "source_line": 24, "source_row_part": 1, "label": "고혈압, 당뇨, 고지혈증, 간질환, 신질환, 정신과질환", "cue": "고혈압이나 당뇨, 고지혈증 있으세요? 간이나", "previous_tail": "기존에 진단 받으신 질환 있으세요?", "exact_text": "고혈압이나 당뇨, 고지혈증 있으세요? 간이나 콩팥 관련 질환 있으세요? 정신건강의학과 진료 보신 적 있으신가요?", "kind": "recitation"}, {"id": "H24", "section": "History taking", "source_line": 25, "source_row_part": 1, "label": "약 · 복용 중인 약물", "cue": "추가로 드시고 있는 약물 있으세요", "previous_tail": "관련 질환 있으세요? 정신건강의학과 진료 보신 적 있으신가요?", "exact_text": "추가로 드시고 있는 약물 있으세요?", "kind": "recitation"}, {"id": "H25", "section": "History taking", "source_line": 26, "source_row_part": 1, "label": "사 · 직업/스트레스, 흡연, 음주", "cue": "실례지만 직업이 어떻게 되세요? 스트레스를", "previous_tail": "추가로 드시고 있는 약물 있으세요?", "exact_text": "실례지만 직업이 어떻게 되세요? 스트레스를 많이 받으시나요?, 흡연/음주는 하시나요?", "kind": "recitation"}, {"id": "H26", "section": "History taking", "source_line": 27, "source_row_part": 1, "label": "가 · 가족 중 유사 증상, 간질환, 신질환", "cue": "가족 중에서도 약물로 인해 힘들어하셨던 분", "previous_tail": "되세요? 스트레스를 많이 받으시나요?, 흡연/음주는 하시나요?", "exact_text": "가족 중에서도 약물로 인해 힘들어하셨던 분 있으세요? 가족 중 간이나 콩팥 질환 앓으시는 분 있으세요?", "kind": "recitation"}, {"id": "H27", "section": "History taking", "source_line": 28, "source_row_part": 1, "label": "외 · 외상/수술, 입원", "cue": "어디 다치거나, 수술하신 적 있으세요? 입원", "previous_tail": " 있으세요? 가족 중 간이나 콩팥 질환 앓으시는 분 있으세요?", "exact_text": "어디 다치거나, 수술하신 적 있으세요? 입원하신 적 있으세요?", "kind": "recitation"}, {"id": "H28", "section": "History taking", "source_line": 29, "source_row_part": 1, "label": "여 · 월경중/폐경 → 임신가능성", "cue": "실례지만 월경은 하고 계신가요?/폐경 하셨나", "previous_tail": "어디 다치거나, 수술하신 적 있으세요? 입원하신 적 있으세요?", "exact_text": "실례지만 월경은 하고 계신가요?/폐경 하셨나요? 조금 민감한 질문일 수 있지만 꼭 필요한 질문이라 여쭤보겠습니다. 임신 가능성이 있나요?", "kind": "recitation"}, {"id": "H29", "section": "History taking", "source_line": 30, "source_row_part": 1, "label": "★ · 요약", "cue": "힘드셨을텐데 잘 답변해주셔서 감사합니다. 요", "previous_tail": "만 꼭 필요한 질문이라 여쭤보겠습니다. 임신 가능성이 있나요?", "exact_text": "힘드셨을텐데 잘 답변해주셔서 감사합니다. 요약해보자면 ~~이네요. 맞나요?", "kind": "recitation"}, {"id": "K01", "section": "핵심 질환", "source_line": 32, "source_row_part": 1, "label": "핵심 질환 섹션 시작", "cue": "[핵심 질환] ⭐️", "previous_tail": "잘 답변해주셔서 감사합니다. 요약해보자면 ~~이네요. 맞나요?", "exact_text": "[핵심 질환] ⭐️", "kind": "heading"}, {"id": "K02", "section": "핵심 질환", "source_line": 34, "source_row_part": 1, "label": "핵심 질환 이미지", "cue": "핵심 질환 이미지", "previous_tail": "[핵심 질환] ⭐️", "exact_text": "{{upload:hwang_substance_core width=64%}}", "kind": "asset"}, {"id": "K03", "section": "핵심 질환", "source_line": 38, "source_row_part": 1, "label": "페이지 구획 전환", "cue": "--- 페이지 추가 ---", "previous_tail": "d:hwang_substance_core width=64%}}", "exact_text": "--- 페이지 추가 ---", "kind": "separator"}, {"id": "P01", "section": "Physical examination", "source_line": 40, "source_row_part": 1, "label": "Physical examination 섹션 시작", "cue": "[Physical examination] →", "previous_tail": "--- 페이지 추가 ---", "exact_text": "[Physical examination] → 생략 가능", "kind": "heading"}, {"id": "P02", "section": "Physical examination", "source_line": 42, "source_row_part": 1, "label": "★ · 손씻기 + 동의 구하기", "cue": "그럼 이제 신체진찰 진행하려고 하는데 그 과", "previous_tail": "[Physical examination] → 생략 가능", "exact_text": "(손씻기) 그럼 이제 신체진찰 진행하려고 하는데 그 과정에서 신체 접촉 및 노출이 있을 수 있습니다. 진행해도 괜찮을까요?", "kind": "recitation"}, {"id": "P03", "section": "Physical examination", "source_line": 44, "source_row_part": 1, "label": "V/S · 혈압, 맥
