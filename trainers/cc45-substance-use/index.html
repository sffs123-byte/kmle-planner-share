<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f3ee">
<title>CC45 물질 오남용 · 통암기 리허설</title>
<style>
:root {
  --paper: #f4f3ee;
  --paper-raised: #faf9f5;
  --ink: #11110f;
  --ink-soft: #3f3f3a;
  --muted: #74736d;
  --faint: #aaa9a1;
  --line: #d3d1c8;
  --line-strong: #a6a49b;
  --max: 1480px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  font-family: "Pretendard Variable", "SUIT Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--paper); color: var(--ink); font-size: 16px; }
body { margin: 0; min-width: 320px; min-height: 100dvh; background: var(--paper); }
button, select { font: inherit; color: inherit; }
button { border: 0; cursor: pointer; }
button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
button:disabled { cursor: not-allowed; opacity: .34; }
.skip-link { position: fixed; top: .5rem; left: .5rem; z-index: 100; transform: translateY(-180%); background: var(--ink); color: var(--paper); padding: .75rem 1rem; }
.skip-link:focus { transform: none; }
.topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--paper) 94%, transparent); border-bottom: 1px solid var(--line-strong); backdrop-filter: blur(12px); }
.topbar-inner { max-width: var(--max); margin: 0 auto; min-height: 64px; padding: 0 clamp(1rem, 3vw, 2.5rem); display: grid; grid-template-columns: minmax(190px, 1fr) minmax(260px, 1.4fr) minmax(190px, 1fr); align-items: center; gap: 2rem; }
.brand { font-size: .88rem; font-weight: 750; letter-spacing: -.01em; white-space: nowrap; }
.progress-summary { display: grid; grid-template-columns: auto minmax(100px, 1fr); align-items: center; gap: .8rem; min-width: 0; }
.progress-label { font-size: .78rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.progress-track { height: 3px; background: var(--line); overflow: hidden; }
.progress-fill { display: block; width: 0; height: 100%; background: var(--ink); transition: width 220ms var(--ease); }
.source-lock { text-align: right; color: var(--muted); font-size: .72rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.app { max-width: var(--max); margin: 0 auto; padding: 0 clamp(1rem, 3vw, 2.5rem) max(2rem, env(safe-area-inset-bottom)); }
.section-tabs { min-height: 64px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.section-tab { position: relative; min-height: 64px; padding: .75rem .5rem; background: transparent; color: var(--muted); font-size: .82rem; font-weight: 650; }
.section-tab::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: -1px; height: 2px; background: transparent; }
.section-tab[aria-selected="true"] { color: var(--ink); }
.section-tab[aria-selected="true"]::after { background: var(--ink); }
.section-tab small { display: block; margin-top: .22rem; color: var(--faint); font-size: .65rem; font-weight: 550; }
.workspace { display: grid; grid-template-columns: minmax(220px, 2.5fr) minmax(0, 9.5fr); min-height: calc(100dvh - 129px); }
.sidebar { border-right: 1px solid var(--line); padding: clamp(1.5rem, 3vw, 2.6rem) clamp(1.25rem, 2.5vw, 2rem) 2rem 0; }
.sidebar-head { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; margin-bottom: 1.25rem; }
.sidebar-head h2 { margin: 0; font-size: .82rem; font-weight: 760; }
.sidebar-count { color: var(--muted); font-size: .72rem; font-variant-numeric: tabular-nums; }
.chunk-nav { display: grid; gap: .15rem; }
.chunk-nav-button { width: 100%; min-height: 44px; display: grid; grid-template-columns: 2.6rem 1fr auto; align-items: center; gap: .65rem; padding: .62rem .55rem; background: transparent; border-left: 2px solid transparent; text-align: left; color: var(--muted); }
.chunk-nav-button:hover { color: var(--ink); background: #eeede7; }
.chunk-nav-button[aria-current="step"] { color: var(--ink); border-left-color: var(--ink); background: #e9e8e1; }
.chunk-nav-id { font-size: .7rem; font-variant-numeric: tabular-nums; }
.chunk-nav-title { min-width: 0; font-size: .8rem; line-height: 1.35; word-break: keep-all; overflow-wrap: normal; }
.chunk-nav-status { width: .42rem; height: .42rem; border: 1px solid var(--line-strong); border-radius: 50%; }
.chunk-nav-button[data-status="mastered"] .chunk-nav-status { border-color: var(--ink); background: var(--ink); }
.chunk-nav-button[data-status="redo"] .chunk-nav-status { border-color: var(--ink); background: var(--line-strong); box-shadow: inset 0 0 0 1px var(--paper); }
.sidebar-footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.reset-button { min-height: 44px; padding: .4rem 0; background: transparent; color: var(--muted); font-size: .72rem; text-align: left; }
.stage { min-width: 0; padding: clamp(1.5rem, 3.5vw, 3rem) 0 0 clamp(1.25rem, 4vw, 4rem); }
.viewbar { min-height: 46px; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; border-bottom: 1px solid var(--line-strong); }
.view-tabs { display: flex; align-items: stretch; gap: 2rem; }
.view-tab { position: relative; min-height: 46px; padding: 0; background: transparent; color: var(--muted); font-size: .82rem; font-weight: 700; }
.view-tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: transparent; }
.view-tab[aria-selected="true"] { color: var(--ink); }
.view-tab[aria-selected="true"]::after { background: var(--ink); }
.bridge-toggle { min-height: 40px; padding: 0; background: transparent; color: var(--muted); font-size: .72rem; }
.bridge-toggle[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: .25rem; }
.mobile-jump { display: none; width: 100%; min-height: 48px; margin: 1rem 0 0; padding: 0 .75rem; border: 1px solid var(--line-strong); border-radius: 0; background: var(--paper); }
.recall-view { padding-bottom: 2rem; }
.chunk-header { padding: clamp(2rem, 5vw, 4.5rem) 0 1.5rem; }
.chunk-kicker { display: flex; gap: .75rem; align-items: center; color: var(--muted); font-size: .76rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.chunk-kicker .rule { width: 2rem; height: 1px; background: var(--line-strong); }
.chunk-title { margin: .75rem 0 0; font-size: clamp(1.9rem, 4vw, 3.35rem); line-height: 1.08; letter-spacing: -.055em; font-weight: 760; }
.bridge-panel { display: none; margin: .4rem 0 2rem; padding: 1rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: center; color: var(--muted); font-size: .78rem; line-height: 1.55; }
.bridge-panel.visible { display: grid; }
.bridge-arrow { color: var(--ink); }
.bridge-panel strong { display: block; margin-bottom: .25rem; color: var(--ink); font-weight: 700; }
.bridge-next { text-align: right; }
.cue-block { margin-top: .5rem; }
.overline { color: var(--muted); font-size: .72rem; font-weight: 720; letter-spacing: .04em; }
.cue-text { margin: .7rem 0 0; padding: clamp(1.5rem, 4vw, 3rem); min-height: 176px; display: flex; align-items: center; border: 1px solid var(--line-strong); background: var(--paper-raised); font-size: clamp(1.2rem, 2.35vw, 1.75rem); line-height: 1.55; letter-spacing: -.02em; }
.answer-region { margin-top: clamp(2rem, 4vw, 3rem); }
.answer-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding-bottom: .7rem; border-bottom: 1px solid var(--ink); }
.answer-heading h2 { margin: 0; font-size: .86rem; font-weight: 760; }
.answer-meta { color: var(--muted); font-size: .68rem; font-variant-numeric: tabular-nums; }
.answer-placeholder { min-height: 140px; display: grid; place-items: center; color: var(--muted); text-align: center; font-size: .9rem; }
.answer-content { display: none; }
.answer-content.visible { display: block; animation: reveal 280ms var(--ease) both; }
@keyframes reveal { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.source-row { display: grid; grid-template-columns: minmax(7rem, 1.7fr) minmax(0, 5.3fr); gap: clamp(1rem, 3vw, 2.5rem); padding: 1.1rem 0 1.2rem; border-bottom: 1px solid var(--line); }
.source-context { color: var(--muted); font-size: .72rem; line-height: 1.55; }
.source-role { display: block; margin-bottom: .35rem; color: var(--ink); font-size: .64rem; font-weight: 760; letter-spacing: .05em; }
.source-line-number { display: block; margin-top: .5rem; color: var(--faint); font-size: .62rem; font-variant-numeric: tabular-nums; }
.source-text { margin: 0; color: var(--ink); font-size: clamp(1rem, 1.55vw, 1.16rem); font-weight: 500; line-height: 1.85; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.full-chunk-lines .source-text { max-width: 68ch; }
.core-image { display: block; width: min(100%, 46rem); height: auto; border: 1px solid var(--line); background: white; }
.actionbar { display: grid; grid-template-columns: auto minmax(10rem, 1fr) auto auto auto; gap: .65rem; margin-top: 2rem; padding: 1.25rem 0; border-top: 1px solid var(--line-strong); }
.action { min-height: 48px; padding: .7rem 1.05rem; border: 1px solid var(--line-strong); border-radius: 0; background: transparent; font-size: .82rem; font-weight: 720; }
.action:hover { background: #e9e8e1; }
.action-primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.action-primary:hover { background: #2d2d29; }
.action-wrong { color: var(--ink-soft); }
.action-spacer { border: 0; pointer-events: none; }
.sequence { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: end; margin-top: 1rem; padding: 1.15rem 0 2rem; border-top: 1px solid var(--line); }
.sequence-item { min-width: 0; }
.sequence-item:last-child { text-align: right; }
.sequence-label { color: var(--faint); font-size: .62rem; }
.sequence-value { display: block; margin-top: .3rem; color: var(--muted); font-size: .75rem; line-height: 1.4; }
.sequence-current { color: var(--ink); font-size: .78rem; font-weight: 760; font-variant-numeric: tabular-nums; }
.full-view { display: none; padding: clamp(2rem, 4vw, 4rem) 0 5rem; }
.full-view.visible { display: block; }
.full-intro { display: grid; grid-template-columns: minmax(0, 2fr) minmax(13rem, 1fr); gap: 3rem; align-items: end; padding-bottom: 2rem; border-bottom: 1px solid var(--ink); }
.full-intro h1 { margin: 0; max-width: 12ch; font-size: clamp(2.2rem, 5vw, 4.5rem); line-height: .98; letter-spacing: -.065em; }
.full-intro p { margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.7; }
.full-section { padding-top: 4rem; scroll-margin-top: 140px; }
.full-section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding-bottom: .8rem; border-bottom: 2px solid var(--ink); }
.full-section-title h2 { margin: 0; font-size: 1.35rem; letter-spacing: -.03em; }
.full-section-title span { color: var(--muted); font-size: .7rem; }
.full-chunk { display: grid; grid-template-columns: minmax(9rem, 2fr) minmax(0, 7fr); gap: clamp(1.5rem, 4vw, 4rem); padding: 2rem 0; border-bottom: 1px solid var(--line-strong); }
.full-chunk-head { position: sticky; top: 86px; align-self: start; }
.full-chunk-id { color: var(--muted); font-size: .7rem; font-variant-numeric: tabular-nums; }
.full-chunk h3 { margin: .45rem 0 0; font-size: 1rem; line-height: 1.4; }
.full-chunk-lines .source-row:first-child { padding-top: 0; }
.full-chunk-lines .source-row:last-child { border-bottom: 0; padding-bottom: 0; }
.full-chunk-lines .source-row { grid-template-columns: minmax(6rem, 1.3fr) minmax(0, 5.7fr); }
[hidden] { display: none !important; }
@media (max-width: 900px) {
  .topbar-inner { grid-template-columns: 1fr 1.5fr; gap: 1rem; }
  .source-lock { display: none; }
  .workspace { grid-template-columns: minmax(180px, 2.6fr) minmax(0, 7.4fr); }
  .stage { padding-left: 2rem; }
}
@media (max-width: 720px) {
  body { padding-bottom: calc(74px + env(safe-area-inset-bottom)); }
  .topbar-inner { min-height: 56px; grid-template-columns: auto minmax(0, 1fr); padding-inline: 1rem; }
  .brand { font-size: .78rem; }
  .progress-summary { justify-self: stretch; }
  .progress-label { font-size: .68rem; }
  .app { padding-inline: 1rem; }
  .section-tabs { min-height: 58px; margin-inline: -1rem; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-inline: .35rem; }
  .section-tab { min-height: 58px; padding-inline: .15rem; font-size: .72rem; }
  .workspace { display: block; min-height: 0; }
  .sidebar { display: none; }
  .stage { padding: 1rem 0 0; }
  .viewbar { align-items: center; }
  .view-tabs { gap: 1.35rem; }
  .mobile-jump { display: block; }
  .chunk-header { padding: 2.2rem 0 1.1rem; }
  .chunk-title { font-size: clamp(1.75rem, 9vw, 2.6rem); }
  .bridge-panel.visible { grid-template-columns: 1fr; gap: .65rem; }
  .bridge-arrow { display: none; }
  .bridge-next { text-align: left; }
  .cue-text { min-height: 148px; padding: 1.35rem; font-size: 1.18rem; }
  .answer-placeholder { min-height: 108px; }
  .source-row, .full-chunk-lines .source-row { grid-template-columns: 1fr; gap: .55rem; }
  .source-context { display: flex; flex-wrap: wrap; gap: .35rem .7rem; align-items: baseline; }
  .source-role, .source-line-number { display: inline; margin: 0; }
  .source-text { font-size: 1rem; line-height: 1.78; }
  .actionbar { position: fixed; z-index: 35; left: 0; right: 0; bottom: 0; margin: 0; padding: .75rem 1rem max(.75rem, env(safe-area-inset-bottom)); grid-template-columns: 3.25rem minmax(7rem, 1fr) 3.8rem 3.8rem; gap: .5rem; background: color-mix(in srgb, var(--paper) 97%, transparent); border-top: 1px solid var(--line-strong); backdrop-filter: blur(14px); }
  .action { min-height: 48px; padding: .55rem .25rem; font-size: .75rem; }
  .action-spacer { display: none; }
  .sequence { padding-bottom: 1rem; }
  .full-intro { grid-template-columns: 1fr; gap: 1rem; }
  .full-intro h1 { font-size: 2.75rem; }
  .full-section { padding-top: 3rem; }
  .full-chunk { grid-template-columns: 1fr; gap: 1.25rem; }
  .full-chunk-head { position: static; }
}
@media (max-width: 390px) {
  .brand { max-width: 8.5rem; white-space: normal; line-height: 1.15; }
  .progress-summary { gap: .5rem; }
  .progress-label { max-width: 5.8rem; white-space: normal; line-height: 1.2; }
  .bridge-toggle { font-size: .68rem; }
  .actionbar { padding-inline: .65rem; gap: .4rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<a class="skip-link" href="#main">본문으로 건너뛰기</a>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">CPX 통암기 리허설</div>
    <div class="progress-summary" aria-label="전체 암기 진행률">
      <span class="progress-label" id="progressLabel"></span>
      <span class="progress-track"><span class="progress-fill" id="progressFill"></span></span>
    </div>
    <div class="source-lock" id="sourceLock"></div>
  </div>
</header>
<main class="app" id="main">
  <nav class="section-tabs" id="sectionTabs" aria-label="대본 구역" role="tablist"></nav>
  <div class="workspace">
    <aside class="sidebar" aria-label="현재 구역 암기 순서">
      <div class="sidebar-head"><h2 id="sidebarTitle"></h2><span class="sidebar-count" id="sidebarCount"></span></div>
      <nav class="chunk-nav" id="chunkNav" aria-label="암기 단계"></nav>
      <div class="sidebar-footer"><button class="reset-button" id="resetProgress">진행 기록 초기화</button></div>
    </aside>
    <section class="stage">
      <div class="viewbar">
        <div class="view-tabs" role="tablist" aria-label="보기 방식">
          <button class="view-tab" id="recallTab" role="tab" aria-selected="true">암기</button>
          <button class="view-tab" id="fullTab" role="tab" aria-selected="false">전체 대본</button>
        </div>
        <button class="bridge-toggle" id="bridgeToggle" aria-pressed="false">문장 연결 보기</button>
      </div>
      <select class="mobile-jump" id="mobileJump" aria-label="암기 단계 바로 이동"></select>
      <section class="recall-view" id="recallView" role="tabpanel" aria-labelledby="recallTab">
        <header class="chunk-header">
          <div class="chunk-kicker"><span id="chunkPosition"></span><span class="rule"></span><span id="chunkSourceLines"></span></div>
          <h1 class="chunk-title" id="chunkTitle"></h1>
        </header>
        <div class="bridge-panel" id="bridgePanel">
          <div><strong>이전 끝</strong><span id="previousEnding"></span></div>
          <span class="bridge-arrow" aria-hidden="true">→</span>
          <div class="bridge-next"><strong>지금 시작</strong><span id="currentBeginning"></span></div>
        </div>
        <section class="cue-block" aria-labelledby="cueHeading">
          <div class="overline" id="cueHeading">첫 문장</div>
          <p class="cue-text" id="cueText"></p>
        </section>
        <section class="answer-region" aria-labelledby="answerHeading">
          <div class="answer-heading"><h2 id="answerHeading">전체 원문</h2><span class="answer-meta" id="answerMeta"></span></div>
          <div class="answer-placeholder" id="answerPlaceholder">입으로 이 덩어리를 끝까지 말한 뒤<br>원문을 확인하세요.</div>
          <div class="answer-content" id="answerContent" aria-live="polite"></div>
        </section>
        <div class="actionbar" id="actionbar">
          <button class="action" id="previousButton" aria-label="이전 암기 단계">이전</button>
          <span class="action-spacer" aria-hidden="true"></span>
          <button class="action action-primary" id="revealButton">원문 보기</button>
          <button class="action action-wrong" id="redoButton">다시</button>
          <button class="action" id="masterButton">외움</button>
        </div>
        <nav class="sequence" aria-label="앞뒤 암기 단계">
          <div class="sequence-item"><span class="sequence-label">이전</span><span class="sequence-value" id="sequencePrevious"></span></div>
          <div class="sequence-current" id="sequenceCurrent"></div>
          <div class="sequence-item"><span class="sequence-label">다음</span><span class="sequence-value" id="sequenceNext"></span></div>
        </nav>
      </section>
      <section class="full-view" id="fullView" role="tabpanel" aria-labelledby="fullTab">
        <header class="full-intro">
          <h1>45. 약물 오남용</h1>
          <p>암기 단위만 다시 묶었고 원문 문구는 줄이거나 고치지 않았습니다.<br><span id="fullCoverage"></span></p>
        </header>
        <div id="fullContent"></div>
      </section>
    </section>
  </div>
</main>

rce_plain":"또 오랜 기간 약물을 복용하면 몸이 이에 익숙해져 있어 갑자기 약물을 끊었을 때 금단 증상이 생길 수 있습니다. ~~~ 등의 증상이 타날 수 있습니다. 무척 힘들겠지만 며칠 지나면 점점 사라지기 때문에 너무 걱정하시진 않으셔도 됩니다. 이 시기를 잘 넘길 수 있도록 금단증상을 줄여주는 약도 같이 챙겨드리겠습니다."}],"previous":{"id":"E07","title":"격려·감량 목표·대체 전략","ending":"여기까지 이해 되셨나요?"},"next":{"id":"E09","title":"지지·추적 계획","cue":"약물을 끊는 게 얼마나 어려운지 잘 알고 있습니다."}},{"id":"E09","order":29,"section_id":"education","section_name":"설명·교육","section_step":9,"section_total":9,"title":"지지·추적 계획","source_lines":[75,76],"cue":"약물을 끊는 게 얼마나 어려운지 잘 알고 있습니다.","ending":"수고 많으셨습니다.","rows":[{"source_line":75,"role":"spoken","context":["★"],"text":"약물을 끊는 게 얼마나 어려운지 잘 알고 있습니다. 그 과정에서 예상치 못한 어려움이 있을 수 있겠지만 포기하지 마시고 제가 옆에서 OOO님의 성공적인 약물 중단과 건강 회복을 도와드리겠습니다","source_plain":"★ | 약물을 끊는 게 얼마나 어려운지 잘 알고 있습니다. 그 과정에서 예상치 못한 어려움이 있을 수 있겠지만 포기하지 마시고 제가 옆에서 OOO님의 성공적인 약물 중단과 건강 회복을 도와드리겠습니다"},{"source_line":76,"role":"spoken","context":[],"text":"여기까지 궁금한 점 있으신가요? 네, 그러면 1~2주 뒤에 다시 외래 방문하셔서 그동안 있었던 일들에 대해 말씀 나눠보도록 하겠습니다. 혹시라도 중간에 신체적, 정신적으로 많이 힘드실 때는 언제든 찾아오셔도 좋습니다. 수고 많으셨습니다.","source_plain":"여기까지 궁금한 점 있으신가요? 네, 그러면 1~2주 뒤에 다시 외래 방문하셔서 그동안 있었던 일들에 대해 말씀 나눠보도록 하겠습니다. 혹시라도 중간에 신체적, 정신적으로 많이 힘드실 때는 언제든 찾아오셔도 좋습니다. 수고 많으셨습니다."}],"previous":{"id":"E08","title":"치료·금단 설명","ending":"이 시기를 잘 넘길 수 있도록 금단증상을 줄여주는 약도 같이 챙겨드리겠습니다."},"next":null}],"full_source":[{"source_line":1,"section":"History taking","type":"heading","plain":"[History taking]"},{"source_line":3,"section":"History taking","type":"row","plain":"★ | 손씻기 + 자기소개 및 환자 확인 + PPI | (손씻기) 안녕하세요, 학생 의사 손유영입니다. 환자분 성함과 나이가 어떻게 되세요? 기다리시느라 고생 많으셨습니다. 지금부터 10분 정도 진료 보려고 하는데, 중간에 궁금한 점 있으시면 편하게 말씀해주세요.","cells":["★","손씻기 + 자기소개 및 환자 확인 + PPI","(손씻기) 안녕하세요, 학생 의사 손유영입니다. 환자분 성함과 나이가 어떻게 되세요? 기다리시느라 고생 많으셨습니다. 지금부터 10분 정도 진료 보려고 하는데, 중간에 궁금한 점 있으시면 편하게 말씀해주세요."]},{"source_line":4,"section":"History taking","type":"delimiter","plain":"|---|---|---|"},{"source_line":5,"section":"History taking","type":"row","plain":"C.C | 어떤 것 + 자세히(어떤 약, 어떤 경로) | 오늘 어떤 것 때문에 병원에 오셨나요? -> 어떤 <script>
(() => {
  'use strict';
  const chunks = DATA.chunks;
  const sections = DATA.sections;
  const storageKey = 'cpx45-fullscript-progress-v2';
  const $ = id => document.getElementById(id);
  let state = { index: 0, statuses: {}, view: 'recall', bridge: false };
  try { state = { ...state, ...JSON.parse(localStorage.getItem(storageKey) || '{}') }; } catch (_) {}
  state.index = Math.max(0, Math.min(chunks.length - 1, Number(state.index) || 0));
  state.statuses = state.statuses || {};
  let revealed = false;
  let resetArmed = false;
  let resetTimer = null;

  const roleNames = {
    spoken: '말할 원문',
    action: '진찰 행동',
    concept: '핵심 개념',
    placeholder: '원문 빈칸',
    asset: '원문 이미지'
  };

  function persist() {
    localStorage.setItem(storageKey, JSON.stringify({
      index: state.index,
      statuses: state.statuses,
      view: state.view,
      bridge: state.bridge
    }));
  }

  function current() { return chunks[state.index]; }

  function sectionChunks(sectionId) {
    return chunks.filter(chunk => chunk.section_id === sectionId);
  }

  function firstIncompleteIndex(sectionId) {
    const candidates = chunks.map((chunk, index) => ({ chunk, index })).filter(item => item.chunk.section_id === sectionId);
    const open = candidates.find(item => state.statuses[item.chunk.id] !== 'mastered');
    return (open || candidates[0]).index;
  }

  function makeSourceRow(row) {
    const wrapper = document.createElement('div');
    wrapper.className = 'source-row';
    wrapper.dataset.role = row.role;
    wrapper.dataset.sourceLine = String(row.source_line);
    const context = document.createElement('div');
    context.className = 'source-context';
    const role = document.createElement('span');
    role.className = 'source-role';
    role.textContent = roleNames[row.role] || '원문';
    context.appendChild(role);
    if (row.context && row.context.length) {
      const labels = document.createElement('span');
      labels.textContent = row.context.join(' · ');
      context.appendChild(labels);
    }
    const line = document.createElement('span');
    line.className = 'source-line-number';
    line.textContent = `원문 ${row.source_line}행`;
    context.appendChild(line);
    wrapper.appendChild(context);
    if (row.role === 'asset') {
      const image = document.createElement('img');
      image.className = 'core-image';
      image.src = DATA.core_image_data_url;
      image.alt = '물질 사용장애와 물질 관련 상태의 관계를 설명하는 핵심질환 도식';
      wrapper.appendChild(image);
    } else {
      const text = document.createElement('p');
      text.className = 'source-text';
      text.textContent = row.text;
      wrapper.appendChild(text);
    }
    return wrapper;
  }

  function renderSectionTabs() {
    const active = current().section_id;
    $('sectionTabs').replaceChildren(...sections.map(section => {
      const button = document.createElement('button');
      button.className = 'section-tab';
      button.type = 'button';
      button.role = 'tab';
      button.setAttribute('aria-selected', section.id === active ? 'true' : 'false');
      const list = sectionChunks(section.id);
      const mastered = list.filter(chunk => state.statuses[chunk.id] === 'mastered').length;
      button.innerHTML = `<span>${section.name}</span><small>${mastered} / ${list.length}${section.optional ? ' · 선택' : ''}</small>`;
      button.addEventListener('click', () => go(firstIncompleteIndex(section.id)));
      return button;
    }));
  }

  function renderSidebar() {
    const chunk = current();
    const list = sectionChunks(chunk.section_id);
    $('sidebarTitle').textContent = `${chunk.section_name} 순서`;
    $('sidebarCount').textContent = `${chunk.section_step} / ${chunk.section_total}`;
    const buttons = list.map(item => {
      const button = document.createElement('button');
      button.className = 'chunk-nav-button';
      button.type = 'button';
      button.dataset.status = state.statuses[item.id] || 'new';
      if (item.id === chunk.id) button.setAttribute('aria-current', 'step');
      const id = document.createElement('span'); id.className = 'chunk-nav-id'; id.textContent = item.id;
      const title = document.createElement('span'); title.className = 'chunk-nav-title'; title.textContent = item.title;
      const status = document.createElement('span'); status.className = 'chunk-nav-status'; status.setAttribute('aria-hidden', 'true');
      button.append(id, title, status);
      button.addEventListener('click', () => go(chunks.indexOf(item)));
      return button;
    });
    $('chunkNav').replaceChildren(...buttons);
    $('mobileJump').replaceChildren(...list.map(item => {
      const option = document.createElement('option');
      option.value = chunks.indexOf(item);
      option.textContent = `${item.id} · ${item.title}`;
      option.selected = item.id === chunk.id;
      return option;
    }));
  }

  function renderProgress() {
    const mastered = chunks.filter(chunk => state.statuses[chunk.id] === 'mastered').length;
    const percent = chunks.length ? mastered / chunks.length * 100 : 0;
    $('progressLabel').textContent = `${current().section_name} ${current().section_step} / ${current().section_total}`;
    $('progressFill').style.width = `${percent}%`;
    $('sourceLock').textContent = `전체 ${chunks.length}개 · 완료 ${mastered}개 · 원문 ${DATA.audit.mapped_semantic_lines}/${DATA.audit.semantic_source_lines}`;
  }

  function renderAnswer() {
    const chunk = current();
    $('answerContent').replaceChildren(...chunk.rows.map(makeSourceRow));
    $('answerContent').classList.toggle('visible', revealed);
    $('answerPlaceholder').hidden = revealed;
    $('revealButton').textContent = revealed ? '원문 가리기' : '원문 보기';
  }

  function renderRecall() {
    const chunk = current();
    $('chunkPosition').textContent = `${chunk.id} · ${chunk.section_name} ${chunk.section_step} / ${chunk.section_total}`;
    $('chunkSourceLines').textContent = `원문 ${chunk.source_lines.length}행`;
    $('chunkTitle').textContent = chunk.title;
    $('cueText').textContent = chunk.cue;
    $('answerMeta').textContent = `원문 ${chunk.source_lines.join(' · ')}행`;
    $('previousEnding').textContent = chunk.previous ? chunk.previous.ending : '처음부터 시작합니다.';
    $('currentBeginning').textContent = chunk.cue;
    $('bridgePanel').classList.toggle('visible', state.bridge);
    $('bridgeToggle').setAttribute('aria-pressed', state.bridge ? 'true' : 'false');
    $('bridgeToggle').textContent = state.bridge ? '문장 연결 숨기기' : '문장 연결 보기';
    $('previousButton').disabled = state.index === 0;
    $('sequencePrevious').textContent = chunk.previous ? `${chunk.previous.id} · ${chunk.previous.title}` : '시작';
    $('sequenceCurrent').textContent = `${state.index + 1} / ${chunks.length}`;
    $('sequenceNext').textContent = chunk.next ? `${chunk.next.id} · ${chunk.next.title}` : '완료';
    renderAnswer();
  }

  function renderView() {
    const recall = state.view === 'recall';
    $('recallTab').setAttribute('aria-selected', recall ? 'true' : 'false');
    $('fullTab').setAttribute('aria-selected', recall ? 'false' : 'true');
    $('recallView').hidden = !recall;
    $('fullView').classList.toggle('visible', !recall);
    $('mobileJump').hidden = !recall;
    $('bridgeToggle').hidden = !recall;
  }

  function render() {
    renderProgress();
    renderSectionTabs();
    renderSidebar();
    renderRecall();
    renderView();
    persist();
  }

  function go(index) {
    state.index = Math.max(0, Math.min(chunks.length - 1, index));
    revealed = false;
    state.view = 'recall';
    render();
    if (window.matchMedia('(max-width: 720px)').matches) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function mark(status) {
    state.statuses[current().id] = status;
    if (state.index < chunks.length - 1) go(state.index + 1);
    else render();
  }

  function buildFullView() {
    const nodes = [];
    sections.forEach(section => {
      const sectionNode = document.createElement('section');
      sectionNode.className = 'full-section';
      sectionNode.id = `full-${section.id}`;
      const title = document.createElement('div');
      title.className = 'full-section-title';
      const h2 = document.createElement('h2'); h2.textContent = section.name;
      const count = document.createElement('span'); count.textContent = `${sectionChunks(section.id).length}개 단위${section.optional ? ' · 원문상 생략 가능' : ''}`;
      title.append(h2, count);
      sectionNode.appendChild(title);
      sectionChunks(section.id).forEach(chunk => {
        const article = document.createElement('article');
        article.className = 'full-chunk';
        article.id = `full-${chunk.id}`;
        const head = document.createElement('header'); head.className = 'full-chunk-head';
        const id = document.createElement('div'); id.className = 'full-chunk-id'; id.textContent = `${chunk.id} · 원문 ${chunk.source_lines.join(', ')}행`;
        const h3 = document.createElement('h3'); h3.textContent = chunk.title;
        head.append(id, h3);
        const lines = document.createElement('div'); lines.className = 'full-chunk-lines';
        lines.replaceChildren(...chunk.rows.map(makeSourceRow));
        article.append(head, lines);
        sectionNode.appendChild(article);
      });
      nodes.push(sectionNode);
    });
    $('fullContent').replaceChildren(...nodes);
    $('fullCoverage').textContent = `원문 의미 행 ${DATA.audit.mapped_semantic_lines}/${DATA.audit.semantic_source_lines} · 누락 0 · 중복 0`;
  }

  $('previousButton').addEventListener('click', () => go(state.index - 1));
  $('revealButton').addEventListener('click', () => { revealed = !revealed; renderAnswer(); });
  $('redoButton').addEventListener('click', () => mark('redo'));
  $('masterButton').addEventListener('click', () => mark('mastered'));
  $('mobileJump').addEventListener('change', event => go(Number(event.target.value)));
  $('bridgeToggle').addEventListener('click', () => { state.bridge = !state.bridge; render(); });
  $('recallTab').addEventListener('click', () => { state.view = 'recall'; renderView(); persist(); });
  $('fullTab').addEventListener('click', () => { state.view = 'full'; renderView(); persist(); });
  $('resetProgress').addEventListener('click', () => {
    if (!resetArmed) {
      resetArmed = true;
      $('resetProgress').textContent = '한 번 더 눌러 초기화';
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => { resetArmed = false; $('resetProgress').textContent = '진행 기록 초기화'; }, 3000);
      return;
    }
    state.statuses = {};
    state.index = 0;
    resetArmed = false;
    $('resetProgress').textContent = '진행 기록 초기화';
    render();
  });

  document.addEventListener('keydown', event => {
    if (event.target.matches('button, select, input, textarea, a')) return;
    if (event.key === 'ArrowRight') go(state.index + 1);
    else if (event.key === 'ArrowLeft') go(state.index - 1);
    else if (event.code === 'Space' && state.view === 'recall') { event.preventDefault(); $('revealButton').click(); }
    else if (event.key === '1' && state.view === 'recall') mark('redo');
    else if (event.key === '2' && state.view === 'recall') mark('mastered');
  });

  buildFullView();
  render();
})();
</script>
