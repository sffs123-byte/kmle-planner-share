<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f3ee">
<link rel="icon" href="data:,">
<title>CPX 상담 4종 · 통암기 리허설</title>
<style>
:root {
  --paper: #f4f3ee;
  --paper-raised: #faf9f5;
  --ink: #11110f;
  --ink-soft: #3f3f3a;
  --muted: #74736d;
  --faint: #aaa9a1;
  --line: #d3d1c8;
  --line-strong: #a6a49b;
  --max: 1480px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  font-family: "Pretendard Variable", "SUIT Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { max-width: 100%; overflow-x: clip; background: var(--paper); color: var(--ink); font-size: 16px; }
body { margin: 0; min-width: 320px; min-height: 100dvh; max-width: 100%; overflow-x: clip; background: var(--paper); }
button, select { font: inherit; color: inherit; }
button { border: 0; cursor: pointer; }
button:focus-visible, select:focus-visible, a:focus-visible, [tabindex="-1"]:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
button:disabled { cursor: not-allowed; opacity: .34; }
[hidden] { display: none !important; }
.skip-link { position: fixed; top: .5rem; left: .5rem; z-index: 100; transform: translateY(-180%); background: var(--ink); color: var(--paper); padding: .75rem 1rem; }
.skip-link:focus { transform: none; }
.topbar { position: sticky; top: 0; z-index: 40; background: var(--paper); border-bottom: 1px solid var(--line-strong); }
.topbar-inner { max-width: var(--max); min-height: 64px; margin: 0 auto; padding: 0 clamp(1rem, 3vw, 2.5rem); display: grid; grid-template-columns: auto minmax(150px, .7fr) minmax(260px, 1.25fr) auto; align-items: center; gap: clamp(.8rem, 2vw, 2rem); }
.home-active .topbar-inner { grid-template-columns: 1fr; }
.home-button { min-width: 64px; min-height: 44px; padding: 0 .75rem; border: 1px solid var(--line-strong); background: transparent; font-size: .78rem; font-weight: 760; }
.home-button:hover { background: #e9e8e1; }
.brand { min-width: 0; font-size: .88rem; font-weight: 760; letter-spacing: -.01em; overflow-wrap: anywhere; }
.home-active .brand { text-align: left; }
.progress-summary { display: grid; grid-template-columns: auto minmax(100px, 1fr); align-items: center; gap: .8rem; min-width: 0; }
.progress-label { font-size: .76rem; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.progress-track { height: 3px; background: var(--line); }
.progress-fill { display: block; width: 0; height: 100%; background: var(--ink); transition: width 220ms var(--ease); }
.source-lock { color: var(--muted); font-size: .7rem; line-height: 1.35; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.app { max-width: var(--max); margin: 0 auto; padding: 0 clamp(1rem, 3vw, 2.5rem) max(2rem, env(safe-area-inset-bottom)); }

.home-screen { width: min(100%, 1100px); margin: 0 auto; padding: clamp(3.25rem, 8vw, 7rem) 0 4rem; }
.home-intro { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(15rem, .8fr); align-items: end; gap: clamp(2rem, 6vw, 6rem); padding-bottom: clamp(2rem, 5vw, 4rem); border-bottom: 1px solid var(--ink); }
.home-kicker { margin: 0 0 .75rem; color: var(--muted); font-size: .72rem; font-weight: 760; letter-spacing: .06em; }
.home-title { margin: 0; max-width: 13ch; font-size: clamp(2.1rem, 5.5vw, 3.25rem); line-height: 1.02; letter-spacing: -.055em; }
.home-copy { margin: 0; color: var(--muted); font-size: .84rem; line-height: 1.75; }
.topic-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 1px; border-left: 1px solid var(--line-strong); }
.topic-card { width: 100%; min-height: 168px; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr auto; gap: .4rem 1.25rem; padding: clamp(1.35rem, 3vw, 2.2rem); border-right: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); background: transparent; text-align: left; }
.topic-card:hover { background: #e9e8e1; }
.topic-number { grid-row: 1 / 3; color: var(--muted); font-size: .7rem; font-variant-numeric: tabular-nums; }
.topic-label { font-size: clamp(1.35rem, 2.6vw, 2rem); font-weight: 760; letter-spacing: -.035em; line-height: 1.18; overflow-wrap: anywhere; word-break: keep-all; }
.topic-meta { align-self: end; color: var(--muted); font-size: .74rem; line-height: 1.5; overflow-wrap: anywhere; }
.topic-progress { grid-column: 2; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .8rem; color: var(--muted); font-size: .68rem; font-variant-numeric: tabular-nums; }
.topic-progress-rule { height: 1px; background: var(--line-strong); }
.home-keys { margin-top: 1.2rem; color: var(--muted); font-size: .68rem; line-height: 1.6; }

.section-tabs { min-height: 64px; display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
.section-tab { position: relative; flex: 1 1 0; min-width: 0; min-height: 64px; padding: .7rem .45rem; background: transparent; color: var(--muted); font-size: .8rem; font-weight: 670; overflow-wrap: anywhere; word-break: keep-all; }
.section-tab::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: -1px; height: 2px; background: transparent; }
.section-tab[aria-selected="true"] { color: var(--ink); }
.section-tab[aria-selected="true"]::after { background: var(--ink); }
.section-tab small { display: block; margin-top: .2rem; color: var(--faint); font-size: .64rem; font-weight: 560; }
.workspace { display: grid; grid-template-columns: minmax(220px, 2.35fr) minmax(0, 9.65fr); min-height: calc(100dvh - 129px); }
.sidebar { min-width: 0; border-right: 1px solid var(--line); padding: clamp(1.5rem, 3vw, 2.6rem) clamp(1.1rem, 2.5vw, 2rem) 2rem 0; }
.sidebar-head { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; margin-bottom: 1.25rem; }
.sidebar-head h2 { margin: 0; font-size: .82rem; font-weight: 760; overflow-wrap: anywhere; }
.sidebar-count { color: var(--muted); font-size: .72rem; font-variant-numeric: tabular-nums; }
.chunk-nav { display: grid; gap: .15rem; }
.chunk-nav-button { width: 100%; min-height: 44px; display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) auto; align-items: center; gap: .65rem; padding: .62rem .55rem; background: transparent; border-left: 2px solid transparent; text-align: left; color: var(--muted); }
.chunk-nav-button:hover { color: var(--ink); background: #eeede7; }
.chunk-nav-button[aria-current="step"] { color: var(--ink); border-left-color: var(--ink); background: #e9e8e1; }
.chunk-nav-id { font-size: .7rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chunk-nav-title { min-width: 0; font-size: .8rem; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
.chunk-nav-status { width: .44rem; height: .44rem; border: 1px solid var(--line-strong); border-radius: 50%; }
.chunk-nav-button[data-status="mastered"] .chunk-nav-status { border-color: var(--ink); background: var(--ink); }
.chunk-nav-button[data-status="redo"] .chunk-nav-status { border-color: var(--ink); background: var(--line-strong); }
.sidebar-footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.reset-button { width: 100%; min-height: 44px; padding: .45rem 0; background: transparent; color: var(--muted); font-size: .72rem; text-align: left; }
.reset-button[aria-pressed="true"] { color: var(--ink); font-weight: 720; }
.stage { min-width: 0; padding: clamp(1.5rem, 3.5vw, 3rem) 0 0 clamp(1.25rem, 4vw, 4rem); }
.viewbar { min-height: 48px; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; border-bottom: 1px solid var(--line-strong); }
.view-tabs { display: flex; align-items: stretch; gap: 2rem; }
.view-tab { position: relative; min-width: 44px; min-height: 48px; padding: 0; background: transparent; color: var(--muted); font-size: .82rem; font-weight: 700; }
.view-tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: transparent; }
.view-tab[aria-selected="true"] { color: var(--ink); }
.view-tab[aria-selected="true"]::after { background: var(--ink); }
.bridge-toggle { min-width: 44px; min-height: 44px; padding: 0; background: transparent; color: var(--muted); font-size: .72rem; }
.bridge-toggle[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: .25rem; }
.mobile-jump { display: none; width: 100%; min-height: 48px; margin: 1rem 0 0; padding: 0 .75rem; border: 1px solid var(--line-strong); border-radius: 0; background: var(--paper); }
.mobile-reset-button { display: none; width: 100%; min-height: 44px; margin: .35rem 0 0; padding: .45rem .75rem; border-bottom: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .7rem; text-align: left; }
.mobile-reset-button[aria-pressed="true"] { color: var(--ink); font-weight: 720; }
.recall-view { padding-bottom: 2rem; }
.chunk-header { padding: clamp(1.5rem, 3vw, 2.75rem) 0 1.2rem; }
.chunk-kicker { display: flex; flex-wrap: wrap; gap: .65rem .75rem; align-items: center; color: var(--muted); font-size: .76rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.chunk-kicker .rule { width: 2rem; height: 1px; background: var(--line-strong); }
.chunk-title { margin: .75rem 0 0; font-size: clamp(1.9rem, 4vw, 3.35rem); line-height: 1.08; letter-spacing: -.055em; font-weight: 760; word-break: keep-all; overflow-wrap: anywhere; }
.bridge-panel { display: none; margin: .4rem 0 2rem; padding: 1rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 1rem; align-items: center; color: var(--muted); font-size: .78rem; line-height: 1.55; }
.bridge-panel.visible { display: grid; }
.bridge-panel > * { min-width: 0; overflow-wrap: anywhere; }
.bridge-arrow { color: var(--ink); }
.bridge-panel strong { display: block; margin-bottom: .25rem; color: var(--ink); font-weight: 700; }
.bridge-next { text-align: right; }
.cue-block { margin-top: .5rem; }
.overline { color: var(--muted); font-size: .72rem; font-weight: 720; letter-spacing: .04em; }
.cue-text { margin: .7rem 0 0; padding: clamp(1.25rem, 3vw, 2.25rem); min-height: 152px; display: flex; align-items: center; border: 1px solid var(--line-strong); background: var(--paper-raised); font-size: clamp(1.2rem, 2.35vw, 1.75rem); line-height: 1.55; letter-spacing: -.02em; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.answer-region { margin-top: clamp(1.25rem, 2.5vw, 2rem); }
.answer-heading { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .7rem 1rem; padding-bottom: .7rem; border-bottom: 1px solid var(--ink); }
.answer-heading h2 { margin: 0; font-size: .86rem; font-weight: 760; }
.answer-meta { color: var(--muted); font-size: .68rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.answer-placeholder { min-height: 108px; display: grid; place-items: center; color: var(--muted); text-align: center; font-size: .9rem; }
.answer-content { display: none; }
.answer-content.visible { display: block; animation: reveal 280ms var(--ease) both; }
@keyframes reveal { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.source-row { min-width: 0; display: grid; grid-template-columns: minmax(7rem, 1.7fr) minmax(0, 5.3fr); gap: clamp(1rem, 3vw, 2.5rem); padding: 1.1rem 0 1.2rem; border-bottom: 1px solid var(--line); }
.source-context { min-width: 0; color: var(--muted); font-size: .72rem; line-height: 1.55; overflow-wrap: anywhere; }
.source-role { display: block; margin-bottom: .35rem; color: var(--ink); font-size: .64rem; font-weight: 760; letter-spacing: .05em; }
.source-line-number { display: block; margin-top: .5rem; color: var(--faint); font-size: .62rem; font-variant-numeric: tabular-nums; }
.source-text { min-width: 0; margin: 0; color: var(--ink); font-size: clamp(1rem, 1.55vw, 1.16rem); font-weight: 500; line-height: 1.85; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.full-chunk-lines .source-text { max-width: 68ch; }
.source-image { display: block; width: min(100%, 46rem); height: auto; border: 1px solid var(--line); background: var(--paper-raised); }
.actionbar { display: grid; grid-template-columns: auto auto minmax(1rem, 1fr) auto auto auto; gap: .65rem; margin-top: 1.25rem; padding: 1rem 0; border-top: 1px solid var(--line-strong); }
.action { min-width: 64px; min-height: 48px; padding: .7rem 1.05rem; border: 1px solid var(--line-strong); border-radius: 0; background: transparent; font-size: .82rem; font-weight: 720; }
.action:hover { background: #e9e8e1; }
.action-primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.action-primary:hover { background: #2d2d29; }
.action-wrong { color: var(--ink-soft); }
.action-spacer { min-width: 0; }
.sequence { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 1rem; align-items: end; margin-top: 1rem; padding: 1.15rem 0 2rem; border-top: 1px solid var(--line); }
.sequence-item { min-width: 0; }
.sequence-item:last-child { text-align: right; }
.sequence-label { color: var(--faint); font-size: .62rem; }
.sequence-value { display: block; margin-top: .3rem; color: var(--muted); font-size: .75rem; line-height: 1.4; overflow-wrap: anywhere; }
.sequence-current { color: var(--ink); font-size: .78rem; font-weight: 760; font-variant-numeric: tabular-nums; }
.full-view { display: none; padding: clamp(2rem, 4vw, 4rem) 0 5rem; }
.full-view.visible { display: block; }
.full-intro { display: grid; grid-template-columns: minmax(0, 2fr) minmax(13rem, 1fr); gap: 3rem; align-items: end; padding-bottom: 2rem; border-bottom: 1px solid var(--ink); }
.full-intro h1 { margin: 0; max-width: 14ch; font-size: clamp(2.1rem, 4.6vw, 3.8rem); line-height: 1; letter-spacing: -.06em; word-break: keep-all; overflow-wrap: anywhere; }
.full-intro p { margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.7; }
.full-section { padding-top: 4rem; scroll-margin-top: 140px; }
.full-section-title { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: .6rem 1rem; padding-bottom: .8rem; border-bottom: 2px solid var(--ink); }
.full-section-title h2 { margin: 0; font-size: 1.35rem; letter-spacing: -.03em; overflow-wrap: anywhere; }
.full-section-title span { color: var(--muted); font-size: .7rem; }
.full-chunk { min-width: 0; display: grid; grid-template-columns: minmax(9rem, 2fr) minmax(0, 7fr); gap: clamp(1.5rem, 4vw, 4rem); padding: 2rem 0; border-bottom: 1px solid var(--line-strong); }
.full-chunk-head { position: sticky; top: 86px; align-self: start; min-width: 0; }
.full-chunk-id { color: var(--muted); font-size: .7rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.full-chunk h3 { margin: .45rem 0 0; font-size: 1rem; line-height: 1.4; word-break: keep-all; overflow-wrap: anywhere; }
.full-chunk-lines { min-width: 0; }
.full-chunk-lines .source-row:first-child { padding-top: 0; }
.full-chunk-lines .source-row:last-child { border-bottom: 0; padding-bottom: 0; }
.full-chunk-lines .source-row { grid-template-columns: minmax(6rem, 1.3fr) minmax(0, 5.7fr); }

@media (max-width: 1024px) {
  .topbar-inner { grid-template-columns: auto minmax(120px, .55fr) minmax(220px, 1.2fr); }
  .source-lock { display: none; }
  .workspace { grid-template-columns: minmax(190px, 2.5fr) minmax(0, 7.5fr); }
  .stage { padding-left: 2rem; }
}
@media (max-width: 760px) {
  body.trainer-active { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  .topbar-inner { min-height: 58px; grid-template-columns: auto minmax(0, 1fr); padding: .45rem 1rem; gap: .75rem; }
  .home-active .topbar-inner { grid-template-columns: 1fr; }
  .brand { text-align: right; font-size: .76rem; }
  .home-active .brand { text-align: left; }
  .progress-summary { grid-column: 1 / -1; grid-template-columns: auto minmax(80px, 1fr); gap: .65rem; padding-bottom: .25rem; }
  .progress-label { font-size: .67rem; }
  .app { padding-inline: 1rem; }
  .home-screen { padding: 3.5rem 0 2rem; }
  .home-intro { grid-template-columns: 1fr; gap: 1.25rem; padding-bottom: 2rem; }
  .home-title { font-size: clamp(2.15rem, 11vw, 2.9rem); }
  .topic-grid { grid-template-columns: 1fr; }
  .topic-card { min-height: 132px; padding: 1.35rem 1.15rem; }
  .section-tabs { min-height: 58px; margin-inline: -1rem; padding-inline: .25rem; }
  .section-tab { min-height: 58px; padding-inline: .2rem; font-size: .7rem; }
  .workspace { display: block; min-height: 0; }
  .sidebar { display: none; }
  .stage { padding: 1rem 0 0; }
  .viewbar { align-items: center; }
  .view-tabs { gap: 1.35rem; }
  .mobile-jump { display: block; }
  .mobile-reset-button { display: block; }
  .chunk-header { padding: 1.35rem 0 .8rem; }
  .chunk-title { font-size: clamp(1.75rem, 9vw, 2.6rem); }
  .bridge-panel.visible { grid-template-columns: 1fr; gap: .65rem; }
  .bridge-arrow { display: none; }
  .bridge-next { text-align: left; }
  .cue-text { min-height: 112px; padding: 1.1rem; font-size: 1.08rem; }
  .answer-region { margin-top: 1rem; }
  .answer-placeholder { min-height: 72px; padding-bottom: .5rem; }
  .source-row, .full-chunk-lines .source-row { grid-template-columns: 1fr; gap: .55rem; }
  .source-context { display: flex; flex-wrap: wrap; gap: .35rem .7rem; align-items: baseline; }
  .source-role, .source-line-number { display: inline; margin: 0; }
  .source-text { font-size: 1rem; line-height: 1.78; }
  .actionbar { position: fixed; z-index: 35; left: 0; right: 0; bottom: 0; margin: 0; padding: .7rem max(.65rem, env(safe-area-inset-left)) max(.7rem, env(safe-area-inset-bottom)) max(.65rem, env(safe-area-inset-right)); grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .35rem; background: rgba(244, 243, 238, .98); border-top: 1px solid var(--line-strong); }
  .action { min-width: 0; min-height: 48px; padding: .5rem .15rem; font-size: .7rem; }
  .action-spacer { display: none; }
  .sequence { display: none; }
  .full-intro { grid-template-columns: 1fr; gap: 1rem; }
  .full-intro h1 { font-size: 2.55rem; }
  .full-section { padding-top: 3rem; }
  .full-chunk { grid-template-columns: 1fr; gap: 1.25rem; }
  .full-chunk-head { position: static; }
}
@media (max-width: 390px) {
  .home-button { min-width: 58px; padding-inline: .5rem; }
  .brand { font-size: .72rem; }
  .progress-summary { align-items: start; }
  .progress-label { max-width: 11rem; line-height: 1.25; }
  .topic-card { grid-template-columns: 1.7rem 1fr; }
  .topic-label { font-size: 1.45rem; }
  .section-tab { font-size: .66rem; }
  .bridge-toggle { font-size: .66rem; }
  .actionbar { gap: .28rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body class="home-active">
<a class="skip-link" href="#main">본문으로 건너뛰기</a>
<header class="topbar">
  <div class="topbar-inner">
    <button class="home-button" id="homeButton" type="button" hidden aria-label="주제 선택 홈으로 돌아가기">← 홈</button>
    <div class="brand" id="brand">CPX 통암기 리허설</div>
    <div class="progress-summary" id="progressSummary" aria-label="현재 주제 암기 진행률" hidden>
      <span class="progress-label" id="progressLabel"></span>
      <span class="progress-track"><span class="progress-fill" id="progressFill"></span></span>
    </div>
    <div class="source-lock" id="sourceLock" hidden></div>
  </div>
</header>
<main class="app" id="main">
  <section class="home-screen" id="homeScreen" aria-labelledby="homeTitle">
    <header class="home-intro">
      <div>
        <p class="home-kicker">FULL-SCRIPT RECALL</p>
        <h1 class="home-title" id="homeTitle" tabindex="-1">상담 대본을<br>순서대로 통암기</h1>
      </div>
      <p class="home-copy">연습할 주제를 고르세요. 네 주제의 진행 기록은 서로 섞이지 않고 이 브라우저에 각각 저장됩니다.</p>
    </header>
    <div class="topic-grid" id="topicGrid" aria-label="상담 주제 선택"></div>
    <p class="home-keys">키보드: ←/→ 이동 · Space 원문 보기/가리기 · 1 다시 · 2 외움 · F 전체 대본 · H 홈</p>
  </section>

  <section id="trainerScreen" tabindex="-1" hidden>
    <nav class="section-tabs" id="sectionTabs" aria-label="대본 구역" role="tablist"></nav>
    <div class="workspace">
      <aside class="sidebar" aria-label="현재 구역 암기 순서">
        <div class="sidebar-head"><h2 id="sidebarTitle"></h2><span class="sidebar-count" id="sidebarCount"></span></div>
        <nav class="chunk-nav" id="chunkNav" aria-label="암기 단계"></nav>
        <div class="sidebar-footer"><button class="reset-button" id="resetProgress" type="button" aria-pressed="false">이 주제 진행 기록 초기화</button></div>
      </aside>

ken","text":"다른 불편한 증상은 없으신가요?","context":["A\n중독","(개방형)"]},{"source_line":18,"role":"spoken","text":"열이 나거나 몸이 으슬으슬 떨리셨나요? 최근 부쩍 피곤하거나 체중 변화가 있었나요?","context":["전신","발열, 오한, 피로, 체중 변화, 부종"]}]},{"id":"H10","title":"동반 증상 ② 신경·정신·심폐","section_id":"history","source_lines":[19,20,21],"cue":"말이 어눌하거나 걷는게 불편하세요?","ending":"기침이나 가래 있으세요?","rows":[{"source_line":19,"role":"spoken","text":"말이 어눌하거나 걷는게 불편하세요? 경련을 일으키거나 의식이 떨어진 적 있나요?","context":["신경","구음장애, 보행장애, 경련, 의식저하,"]},{"source_line":20,"role":"spoken","text":"우울하거나 불안하진 않으세요? 잠을 잘 못 주무시나요? 기억력이나 집중력이 떨어지셨나요? 헛것이 보이거나 들리진 않았나요?","context":["정신","우울, 불안, 수면, 기억력/집중력, 환청/망상"]},{"source_line":21,"role":"spoken","text":"가슴 쪽이 아프세요? 숨이 잘 차거나 숨 쉬기 힘드세요? 기침이나 가래 있으세요?","context":["순환/호흡","가슴통증, 호흡곤란, 기침, 가래"]}]},{"id":"H11","title":"건강검진·과거력","section_id":"history","source_lines":[22,23,24],"cue":"이전 건강검진에서 이상 소견 있었나요?","ending":"정신건강의학과 진료 보신 적 있으신가요?","rows":[{"source_line":22,"role":"spoken","text":"이전 건강검진에서 이상 소견 있었나요?","context":["E","이전 건강검진 이상 소견"]},{"source_line":23,"role":"spoken","text":"기존에 진단 받으신 질환 있으세요?","context":["과","(개방형)"]},{"source_line":24,"role":"spoken","text":"고혈압이나 당뇨, 고지혈증 있으세요? 간이나 콩팥 관련 질환 있으세요? 정신건강의학과 진료 보신 적 있으신가요?","context":["고혈압, 당뇨, 고지혈증, 간질환, 신질환, 정신과질환"]}]},{"id":"H12","title":"약물·사회력·가족력","section_id":"history","source_lines":[25,26,27],"cue":"추가로 드시고 있는 약물 있으세요?","ending":"가족 중 간이나 콩팥 질환 앓으시는 분 있으세요?","rows":[{"source_line":25,"role":"spoken","text":"추가로 드시고 있는 약물 있으세요?","context":["약","복용 중인 약물"]},{"source_line":26,"role":"spoken","text":"실례지만 직업이 어떻게 되세요? 스트레스를 많이 받으시나요?, 흡연/음주는 하시나요?","context":["사","직업/스트레스, 흡연, 음주"]},{"source_line":27,"role":"spoken","text":"가족 중에서도 약물로 인해 힘들어하셨던 분 있으세요? 가족 중 간이나 콩팥 질환 앓으시는 분 있으세요?","context":["가","가족 중 유사 증상, 간질환, 신질환"]}]},{"id":"H13","title":"외상·여성력·문진 마무리","section_id":"history","source_lines":[28,29,30],"cue":"어디 다치거나, 수술하신 적 있으세요?","ending":"맞나요?","rows":[{"source_line":28,"role":"spoken","text":"어디 다치거나, 수술하신 적 있으세요? 입원하신 적 있으세요?","context nding":"호흡 청진, 심장 청진","rows":[{"source_line":51,"role":"spoken","text":"가슴 진찰 진행 시 상의를 탈의해주셔야 합니다. 괜찮을까요? 진료에 불필요한 부분은 가려드리도록 하겠습니다.","context":["★","신체노출 + 불필요한 부분 가리기"]},{"source_line":52,"role":"action","text":"호흡 청진, 심장 청진","context":["가슴"]}]},{"id":"P05","title":"복부 진찰","section_id":"physical","source_lines":[53,54],"cue":"복부 진찰 진행 시 상의를 명치까지, 하의를 골반까지 내려주셔야 합니다.","ending":"시진 – 청진 – 타진 – 촉진","rows":[{"source_line":53,"role":"spoken","text":"복부 진찰 진행 시 상의를 명치까지, 하의를 골반까지 내려주셔야 합니다. 괜찮을까요? 편하게 누우셔서 다리를 구부리고 있으시면 됩니다. 진료에 불필요한 부분은 가려드리도록 하겠습니다.","context":["누워서","★","신체노출 + 불필요한 부분 가리기"]},{"source_line":54,"role":"action","text":"시진 – 청진 – 타진 – 촉진","context":["복부"]}]},{"id":"P06","title":"신체진찰 마무리","section_id":"physical","source_lines":[55],"cue":"(손씻기) 신체진찰 모두 끝났습니다.","ending":"자리로 오시면 오늘 진료 내용 다시 정리해서 말씀드리도록 하겠습니다.","rows":[{"source_line":55,"role":"spoken","text":"(손씻기) 신체진찰 모두 끝났습니다. 도중에 불편한 점은 없으셨나요? 자리로 오시면 오늘 진료 내용 다시 정리해서 말씀드리도록 하겠습니다.","context":["★","손씻기 + PPI"]}]},{"id":"E01","title":"교육 시작","section_id":"education","source_lines":[59],"cue":"진찰 받으시느라 고생 많으셨습니다.","ending":"진찰 받으시느라 고생 많으셨습니다.","rows":[{"source_line":59,"role":"spoken","text":"진찰 받으시느라 고생 많으셨습니다.","context":["★"]}]},{"id":"E02","title":"진단·추가 검사","section_id":"education","source_lines":[61,62],"cue":"지금까지의 문진을 종합해 보았을 때, OOO님께서는 ~~한 것으로 보아 ~~가 의심이 됩니다.","ending":"괜찮을까요?","rows":[{"source_line":61,"role":"spoken","text":"지금까지의 문진을 종합해 보았을 때, OOO님께서는 ~~한 것으로 보아 ~~가 의심이 됩니다.","context":["진단"]},{"source_line":62,"role":"spoken","text":"하지만 ~~ 증상도 있기 때문에 ~~의 가능성도 있습니다. 이에 대해서 추가적으로 ~~를 시행해볼 예정입니다. 괜찮을까요?","context":["검사"]}]},{"id":"E03","title":"장단점 설명","section_id":"education","source_lines":[63,64],"cue":"지금 OOO 님이 ~~~을 필요로 하고 있는 상황을 충분히 이해합니다.","ending":"~~장점~~","rows":[{"source_line":63,"role":"spoken","text":"지금 OOO 님이 ~~~을 필요로 하고 있는 상황을 충분히 이해합니다. 하지만 ~~~를 오랜 기간 사용할 경우, 원하는 효과는 보지 못하고 오히려 ~~~하는 부작용이 생길 수 있습니다.","context":["장단점","단점"]},{"source_line":64,"role":"placeholder","text":"~~장점~~"}]},{"id":"E04","title":"중단 권유","section_id":"education","source_lines":[65],"cue":"이번 기회에 한 번 약물을 끊어 보시는게 어떠신가요?","ending":"네, 정말 잘 결정하셨습니다.","rows":[{"source_line":65,"role":"spoken","text":"이번 기회에 한 번 약물을 끊어 보시는게 어떠신가요? 네, 정말 잘 결정하셨습니다.","context":["예후","권유"]}]},{"id":"E05","title":"거절 대응 ① 약이 필요한 이유","section_id":"education","source_lines":[66],"cue":"약이 필요한 이유를 댐: ~~~ 할 상황에 대해 걱정하고 계시는군요.","ending":"대신 약물을 사용하지 않고도 ~~~ 하지 않도록 도와드릴테니 약물을 끊어 보시는게 어떠신가요?","rows":[{"source_line":66,"role":"spoken","text":"약이 필요한 이유를 댐: ~~~ 할 상황에 대해 걱정하고 계시는군요. 하지만 위에 말씀드렸다시피, 약물을 사용한다면 지금 당장 효과가 있을 수 있을지는 몰라도 점점 효과가 떨어질뿐더러, 오히려 부작용만 심해질 수 있습니다. 대신 약물을 사용하지 않고도 ~~~ 하지 않도록 도와드릴테니 약물을 끊어 보시는게 어떠신가요?"}]},{"id":"E06","title":"거절 대응 ② 금단 두려움","section_id":"education","source_lines":[67],"cue":"금단 증상에 대한 두려움: ~~~ 할 상황에 대해 걱정하고 계시는군요.","ending":"대신 이러한 금단 증상을 줄여주는 약을 처방해드릴테니 약물을 끊어 보시는게 어떠신가요?","rows":[{"source_line":67,"role":"spoken","text":"금단 증상에 대한 두려움: ~~~ 할 상황에 대해 걱정하고 계시는군요. 하지만 이런 금단 증상은 물론 초반엔 많이 힘드시겠지만 결국 시간이 지나면 사라집니다. 대신 이러한 금단 증상을 줄여주는 약을 처방해드릴테니 약물을 끊어 보시는게 어떠신가요?"}]},{"id":"E07","title":"격려·감량 목표·대체 전략","section_id":"education","source_lines":[68,69,70,71,72],"cue":"시작이 반이라는 말이 있듯이 오늘 병원에 오신 것만으로도 정말 잘하셨습니다.","ending":"여기까지 이해 되셨나요?","rows":[{"source_line":68,"role":"spoken","text":"시작이 반이라는 말이 있듯이 오늘 병원에 오신 것만으로도 정말 잘하셨습니다. 약물을 끊을 때에는 혼자 하는 것보다 전문가의 도움을 받는 것이 훨씬 성공률도 높고 힘들기도 덜 힘듭니다. 저도 최선을 다해 도와드리겠습니다.","context":["격려"]},{"source_line":69,"role":"spoken","text":"약물을 단번에 끊기 보다는 점차 횟수나 양을 줄이는 목표를 갖는 것이 좋을 것 같습니다.","context":["교육","목표"]},{"source_line":70,"role":"placeholder","text":"~~날짜~~"},{"source_line":71,"role":"spoken","text":"OOO님은 ~~~ 때문에 약물을 사용하고 계셨는데요, 약물을 사용하는 대신 ~~를 통해 ~~~를 도울 수 있습니다.","context":["전략"]},{"source_line":72,"role":"spoken","text":"여기까지 이해 되셨나요?","context":["요약"]}]},{"id":"E08","title":"치료·금단 설명","section_id":"education","source_lines":[73,74],"cue":"만약 중독 증상이 심하다면 입원하셔서 치료하시는 것을 권해드립니다.","ending":"이 시기를 잘 넘길 수 있도록 금단증상을 줄여주는 약도 같이 챙겨드리겠습니다.","rows":[{"source_line":73,"role":"spoken","text":"만약 중독 증상이 심하다면 입원하셔서 치료하시는 것을 권해드립니다. 해독제를 통해 현재 느끼는 불편한 증상을 완화시킬 수 있고, 길항제나 대체 약물 등으로 서서히 약물의 필요량을 줄이도록 도울 수 있습니다..","context":["치료","약물"]},{"source_line":74,"role":"spoken","text":"또 오랜 기간 약물을 복용하면 몸이 이에 익숙해져 있어 갑자기 약물을 끊었을 때 금단 증상이 생길 수 있습니다. ~~~ 등의 증상이 타날 수 있습니다. 무척 힘들겠지만 며칠 지나면 점점 사라지기 때문에 너무 걱정하시진 않으셔도 됩니다. 이 시기를 잘 넘길 수 있도록 금단증상을 줄여주는 약도 같이 챙겨드리겠습니다."}]},{"id":"E09","title":"지지·추적 계획","section_id":"education","source_lines":[75,76],"cue":"약물을 끊는 게 얼마나 어려운지 잘 알고 있습니다.","ending":"수고 많으셨습니다.","rows":[{"source_line":75,"role":"spoken","text":"약물을 끊는 게 얼마나 어려운지 잘 알고 있습니다. 그 과정에서 예상치 못한 어려움이 있을 수 있겠지만 포기하지 마시고 제가 옆에서 OOO님의 성공적인 약물 중단과 건강 회복을 도와드리겠습니다","context":["★"]},{"source_line":76,"role":"spoken","text":"여기까지 궁금한 점 있으신가요? 네, 그러면 1~2주 뒤에 다시 외래 방문하셔서 그동안 있었던 일들에 대해 말씀 나눠보도록 하겠습니다. 혹시라도 중간에 신체적, 정신적으로 많이 힘드실 때는 언제든 찾아오셔도 좋습니다. 수고 많으셨습니다."}]}],"audit":{"source_row_count":59,"mapped_source_rows":59},"core_image_data_url":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAu0AAADhCAYAAAB844s1AAAAAXNSR0IArs4c6QAAAIRlWElmTU0AKgAAAAgABQESAAMAAAABAAEAAAEaAAUAAAABAAAASgEbAAUAAAABAAAAUgEoAAMAAAABAAIAAIdpAAQAAAABAAAAWgAAAAAAAADcAAAAAQAAANwAAAABAAOgAQADAAAAAQABAACgAgAEAAAAAQAAAu2gAwAEAAAAAQAAAOEAAAAAM/FHZwAAAAlwSFlzAAAh1QAAIdUBBJy0nQAAQABJREFUeAHtnQdgFNX2xs+mQUgCAULvHQRpKqhgRxHsos+CDbGL+rc/pTzs9T0FQey9d7FgQQXFxvOhCIjSu3QIgfTyP9/ZTLJZdpMs2SSbyXc1ZDPllt/Mnvnm3HPv9RRoEiYSIAESIAESIAESIAESIIGIJRAVsTVjxUiABEiABEiABEiABEiABIwARTtvBBIgARIgARIgARIgARKIcAIU7RF+gVg9EiABEiABEiABEiABEqBo5z1AAiRAAiRAAiRAAiRAAhFOgKI9wi8Qq0cCJEACJEACJEACJEACFO28B0iABEiABEiABEiABEggwglQtEf4BWL1SIAESIAESIAESIAESCCGCEiABEiABIIQ0GUsCrKzdSeXswhCKIybPeKJixPxeMKYJ7MiARIgAfcQoGh3z7VkS0iABMJMID9tl+x8fKrkp6WJRFFMhhlvcXb5BRKVlCTJV10tUfUbFG/nJxIgARIggSICFO1FKPiBBEiABPwI5OVL3s4dkp+aqqKd0YR+dML3Z36+FOTliihvJhIgARIggcAEKNoDc+FWEiABEjACHoRrqGD3ULRX2h2B4CPjXGklMGMSIAESqPkE6Dqq+deQLSABEiABEiABEiABEnA5AYp2l19gNo8ESIAESIAESIAESKDmE6Bor/nXkC0gARIgARIgARIgARJwOQGKdpdfYDaPBEiABEiABEiABEi ue":"병원까지 오시느라 고생 많이 하셨습니다.","ending":"오늘 어떤 것 때문에 병원을 방문하셨나요?","rows":[{"source_line":17,"role":"spoken","text":"병원까지 오시느라 고생 많이 하셨습니다. 지금부터 약 10분 정도 환자분과 면담을 진행해 볼텐데 괜찮으실까요?\n진료 중에 불편한 점이 있으면 언제든지 말씀해 주세요. 오늘 어떤 것 때문에 병원을 방문하셨나요?","context":["관계 형성"]}]},{"id":"D04","title":"상처 확인과 폭력 의심 제기","section_id":"rapport","source_lines":[18],"cue":"(보통 멍과 상처를 주소로 내원하며, 넘어져서/부딪쳐서 등의 핑계를 댐) -상처를 한번 살펴보도록 하겠습니다.","ending":"혹시나 환자분께서 이런 어려운 일을 겪고 계시지는 않으신가요?","rows":[{"source_line":18,"role":"spoken","text":"(보통 멍과 상처를 주소로 내원하며, 넘어져서/부딪쳐서 등의 핑계를 댐)\n-상처를 한번 살펴보도록 하겠습니다.\n-O: 상처가 언제 생겼나요?\n-L: 상처가 어디에 있나요?\n-D: (생략 가능)\n-C: 상처가 어떻게 생기게 되었나요?\n-제가 상처를 꼼꼼히 살펴보았는데, 상처들이 생긴 위치가 넘어지거나 부딪쳐서 생기기 어려운 곳인 것 같습니다. 그리고 발생한 시기도 제각각이네요. 이러한 상처를 가지고 내원하시는 많은 분들은 누군가에게 폭력을 당하고 계신 경우가 많습니다. 혹시나 환자분께서 이런 어려운 일을 겪고 계시지는 않으신가요?","context":["폭력 의심"]}]},{"id":"D05","title":"비밀 보장","section_id":"rapport","source_lines":[19],"cue":"말씀해 주시는 것이 많이 힘들고 어려우실 거라 생각되지만, 오늘 저에게 말씀하신 내용은 법적 제출이 필요한 경우와 치료 목적으로 불가피한 경우 외에는 비밀이 보장되며, 절대 누군가에게 누설되지 않습니다.","ending":"의무기록은 법적으로 비밀이 보장됩니다.","rows":[{"source_line":19,"role":"spoken","text":"말씀해 주시는 것이 많이 힘들고 어려우실 거라 생각되지만, 오늘 저에게 말씀하신 내용은 법적 제출이 필요한 경우와 치료 목적으로 불가피한 경우 외에는 비밀이 보장되며, 절대 누군가에게 누설되지 않습니다. 의무기록은 법적으로 비밀이 보장됩니다.","context":["비밀 보장"]}]},{"id":"D06","title":"걱정 표현","section_id":"rapport","source_lines":[20],"cue":"저는 현재 환자분의 상태가 많이 걱정되고, 환자분을 진심으로 도와드리고 싶습니다.","ending":"저에게 부담 없이 말씀해 주시면 제가 알고 있는 것들을 바탕으로 최선을 다해 돕도록 하겠습니다.","rows":[{"source_line":20,"role":"spoken","text":"저는 현재 환자분의 상태가 많이 걱정되고, 환자분을 진심으로 도와드리고 싶습니다.\n저에게 부담 없이 말씀해 주시면 제가 알고 있는 것들을 바탕으로 최선을 다해 돕도록 하겠습니다.","context":["걱정 표현"]}]},{"id":"D07","title":"진료 과정과 존중 공란 보존","section_id":"rapport","source_lines":[21,22],"cue":"힘드셨을텐데 솔직하게 말씀해 주셔서 감사합니다.","ending":"-","rows":[{"source_line":21,"role":"spoken","text":"힘드셨을텐데 솔직하게 말씀해 주셔서 감사합니다. 환자분께서 겪고 계신 상황에 대해 먼저 상담을 해드린 뒤에 상처에 대한 치료를 진행하려고 하는데 괜찮으신가요? 지금 자리는 편하신가요? 힘들면 언제든지 말씀해 주세요.","context":["진료 과정 설명"]},{"source_line":22,"role":"spoken","text":"-","context":["존중"]}]},{"id":"D08","title":"가해자 문진 · 누가/언제/어디서","section_id":"history","source_lines":[23,24,25],"cue":"누가 폭력을 행사하나요?","ending":"주로, 어디서 어떤 상황에서 폭행이 일어나나요?","rows":[{"source_line":23,"role":"spoken","text":"누가 폭력을 행사하나요?","context":["폭력 상황 및 가해자 정보 확인","누가"]},{"source_line":24,"role":"spoken","text":"언제 처음 때리기 시작했나요?","context":["언제"]},{"source_line":25,"role":"spoken","text":"주로, 어디서 어떤 상황에서 폭행이 일어나나요?","context":["어디서"]}]},{"id":"D09","title":"가해자 문진 · 횟수/양상","section_id":"history","source_lines":[26,27],"cue":"얼마나 자주 때리나요?","ending":"• 욕설, 강제적 성관계, 밥 굶김 등이 동반되나요?","rows":[{"source_line":26,"role":"spoken","text":"얼마나 자주 때리나요?","context":["횟수"]},{"source_line":27,"role":"spoken","text":"• 어떻게 때리나요? 도구를 사용해서 때리나요?\n• 욕설, 강제적 성관계, 밥 굶김 등이 동반되나요?","context":["양상"]}]},{"id":"D10","title":"가해자 문진 · 가족/가해자 정보","section_id":"history","source_lines":[28,29],"cue":"아이나 다른 가족들에게도 폭력을 행사하나요?","ending":"폭력이 없을 때 평소 성격, 주변 사람들과의 관계, 술이나 약물 남용 여부, 폭행 후의 태도","rows":[{"source_line":28,"role":"spoken","text":"아이나 다른 가족들에게도 폭력을 행사하나요?","context":["기타 폭력"]},{"source_line":29,"role":"spoken","text":"폭력이 없을 때 평소 성격, 주변 사람들과의 관계, 술이나 약물 남용 여부, 폭행 후의 태도","context":["가해자 정보\n*아는사람"]}]},{"id":"D11","title":"대처와 안전망","section_id":"history","source_lines":[30],"cue":"• 폭력 상황에서 어떻게 대처하시나요?","ending":"• 어디 피해 있을만한 장소가 있으신가요?","rows":[{"source_line":30,"role":"spoken","text":"• 폭력 상황에서 어떻게 대처하시나요? 저항을 하시나요?\n• 주변 사람들에게 폭행 사실을 알리셨나요? 도움을 청할 사람이 있나요?\n• 어디 피해 있을만한 장소가 있으신가요?","context":["대처 확인"]}]},{"id":"D12","title":"신체·정신 상태","section_id":"history","source_lines":[31],"cue":"• 신체 증상 평가(환자가 호소하는 증상 중심으로) - 복통/흉통/두통/골절 • 정신적 상태 평가 - 우울/불안/불면/식욕 저하/집중력 저하/자살 사고/타살 사고(가해자 죽이고 싶음)","ending":"• 신체 증상 평가(환자가 호소하는 증상 중심으로) - 복통/흉통/두통/골절 • 정신적 상태 평가 - 우울/불안/불면/식욕 저하/집중력 저하/자살 사고/타살 사고(가해자 죽이고 싶음)","rows":[{"source_line":31,"role":"spoken","text":"• 신체 증상 평가(환자가 호소하는 증상 중심으로) - 복통/흉통/두통/골절\n• 정신적 상태 평가 - 우울/불안/불면/식욕 저하/집중력 저하/자살 사고/타살 사고(가해자 죽이고 싶음)","context":["의학적 상태 확인"]}]},{"id":"D13","title":"약·사회력·가정력","section_id":"history","source_lines":[32,33,34],"cue":"복용 중인 약물이 있으신가요?","ending":"<- 이게 뭐지..","rows":[{"source_line":32,"role":"spoken","text":"복용 중인 약물이 있으신가요?","context":["약"]},{"source_line":33,"role":"spoken","text":"결혼 과정에서 문제가 있지는 않았나요?\n경제적 어려움을 겪고 있지는 않나요?\n의지할 만한 사람이 있나요?","context":["사"]},{"source_line":34,"role":"spoken","text":"어렸을 때 가정 폭력을 당하신 적이 있나요? <- 이게 뭐지..","context":["가"]}]},{"id":"D14","title":"외상·과거력·여성력","section_id":"history","source_lines":[35,36,37],"cue":"수술, 외상력","ending":"(성 폭력이 없는 상황이면 생략 가능)","rows":[{"source_line":35,"role":"spoken","text":"수술, 외상력","context":["외"]},{"source_line":36,"role":"spoken","text":"평소 앓고 있는 질환이 있으신가요? (당뇨, 고혈압, 간염, 결핵, 알레르기)\n이전에 정신건강의학과 진료 보신 적 있나요?","context":["과"]},{"source_line":37,"role":"spoken","text":"(성 폭력이 없는 상황이면 생략 가능)","context":["여"]}]},{"id":"D15","title":"신체진찰 및 증거 안내","section_id":"physical","source_lines":[38],"cue":"(가정폭력은 대부분 생략) 이제 신체진찰을 하려고 하는데요, 신체진찰 과정에서 신체 접촉과 노출이 있을 수 있습니다.","ending":"(앉아서) • G/A: 전반적인 영양, 위생 상태 확인 • 눈: 빈혈, 충혈 • 입: 구강 성교의 흔적 확인 • 사지: 외상 부위 확인","rows":[{"source_line":38,"role":"action","text":"(가정폭력은 대부분 생략)\n이제 신체진찰을 하려고 하는데요, 신체진찰 과정에서 신체 접촉과 노출이 있을 수 있습니다. 괜찮으신가요? 앞서 말씀드린 대로 증거용 사진 촬영 및 증거물 채취를 시행히야 하며, 간호사를 동반하여 외음부 및 항문 진찰을 해야 합니다.\n(앉아서)\n• G/A: 전반적인 영양, 위생 상태 확인\n• 눈: 빈혈, 충혈\n• 입: 구강 성교의 흔적 확인\n• 사지: 외상 부위 확인","context":["P/E","공통"]}]},{"id":"D16","title":"교육 · 공감/부당함/주변 도움","section_id":"education","source_lines":[39,40,41],"cue":"오랜 시간 동안 혼자서 많이 힘드셨겠네요.","ending":"계속 숨기시면 나머지 가족들에게까지도 해가 될 수 있습니다.","rows":[{"source_line":39,"role":"spoken","text":"오랜 시간 동안 혼자서 많이 힘드셨겠네요. OOO씨는 이 문제에 대해 어떻게 하실 생각이신가요","context":["교육","공감"]},{"source_line":40,"role":"spoken","text":"그 누구도 이러한 대우를 받을 이유는 없습니다. OOO님은 가치 있는 사람입니다.","context":["폭력의 부당함"]},{"source_line":41,"role":"spoken","text":"우선 폭력 사실을 주변에 알리고 도움을 요청해야 합니다. 계속 숨기시면 나머지 가족들에게까지도 해가 될 수 있습니다.","context":["주변에 알리기"]}]},{"id":"D17","title":"교육 · 신고","section_id":"education","source_lines":[42],"cue":"또한 남편분의 행동은 법적으로 잘못된 행동입니다.","ending":"원하신다면 현재 상태를 사진으로 찍어서 증거 자료로 제출하여 신고할 수 있습니다.","rows":[{"source_line":42,"role":"spoken","text":"또한 남편분의 행동은 법적으로 잘못된 행동입니다. 근본적으로 해결하는 것이 가장 좋습니다. 원하신다면 현재 상태를 사진으로 찍어서 증거 자료로 제출하여 신고할 수 있습니다.","context":["신고"]}]},{"id":"D18","title":"교육 · 위기 대처와 쉼터","section_id":"education","source_lines":[43],"cue":"비슷한 상황이 다시 발생했을 때 대처할 수 있는 방법에 대해 알려드리겠습니다.","ending":"가족상담 등의 치료를 진행할 수 있고, 피신할 곳이 없으시다면 제가 쉼터를 소개해 드릴테니 자녀분과 함께 남편과 떨어져서 그곳에 계시는 것이 좋을 것 같습니다.","rows":[{"source_line":43,"role":"spoken","text":"비슷한 상황이 다시 발생했을 때 대처할 수 있는 방법에 대해 알려드리겠습니다. 위급 상황에는 112나, 보건복지부 129, 여성긴급전화 1366 등에 전화하시면 도움을 받으실 수 있습니다. 이것은 심각한 문제이고, 가정에 국한된 문제가 아니라 사회 문제이므로 근절을 위해 모두가 노력해야 합니다.\n가족상담 등의 치료를 진행할 수 있고, 피신할 곳이 없으시다면 제가 쉼터를 소개해 드릴테니 자녀분과 함께 남편과 떨어져서 그곳에 계시는 것이 좋을 것 같습니다.","context":["대처법"]}]},{"id":"D19","title":"교육 · 치료 권유와 마무리","section_id":"education","source_lines":[44],"cue":"많이 힘드셨을텐데 이번 기회에 병원에 오셨으니 제가 도움을 드리고 싶습니다.","ending":"신체 상태에 대해 설명하고 치료 권유 더 궁금한 점 있으신가요?","rows":[{"source_line":44,"role":"spoken","text":"많이 힘드셨을텐데 이번 기회에 병원에 오셨으니 제가 도움을 드리고 싶습니다. 혼자서 걱정하지 마시고 주위에 도움을 요청해 주세요. 병원에 오시면 상처 부위에 대해서는 치료해 드리도록 하겠습니다. 저를 믿고 어려운 말씀해 주셔서 감사합니다. 신체 상태에 대해 설명하고 치료 권유\n더 궁금한 점 있으신가요?","context":["마무리"]}]}],"audit":{"source_row_count":34,"mapped_source_rows":34}}},{"id":"sexual-violence","label":"성폭력","packet":{"meta":{"title":"47-2. 성폭력"},"sections":[{"id":"overview","name":"개요","optional":false},{"id":"rapport","name":"관계 형성","optional":false},{"id":"history","name":"사건·병력","optional":false},{"id":"physical","name":"진찰·증거","optional":false},{"id":"education","name":"교육·추적","optional":false}],"chunks":[{"id":"S01","title":"개요 · 안심/동의/월경력/추후 치료","section_id":"overview","source_lines":[9,10,11,12],"cue":"환자를 안심시키고 비밀 보장, 진료 과정에 대해 언급하며 동의서 작성","ending":"교육에서는 어떤 검사를 할 예정인지, 재방문 시기 안내하고 정신과적 치료로 도움을 줄 수 있음을 알려주기","rows":[{"source_line":9,"role":"concept","text":"<성 폭력>"},{"source_line":10,"role":"concept","text":"환자를 안심시키고 비밀 보장, 진료 과정에 대해 언급하며 동의서 작성"},{"source_line":11,"role":"concept","text":"병력청취는 성 폭력 상황과 월경력 위주로 정보 얻고 P/E는 주로 증거 채취를 위한 과정임을 잘 설명하기"},{"source_line":12,"role":"concept","text":"교육에서는 어떤 검사를 할 예정인지, 재방문 시기 안내하고 정신과적 치료로 도움을 줄 수 있음을 알려주기"}]},{"id":"S02","title":"관계 형성","section_id":"rapport","source_lines":[52],"cue":"병원까지 오시느라 고생 많이 하셨습니다.","ending":"오늘 어떤 것 때문에 병원을 방문하셨나요?","rows":[{"source_line":52,"role":"spoken","text":"병원까지 오시느라 고생 많이 하셨습니다. 지금부터 약 10분 정도 환자분과 면담을 진행해 볼텐데 괜찮으실까요? 진료 중에 불편한 점이 있으면 언제든지 말씀해 주세요. 오늘 어떤 것 때문에 병원을 방문하셨나요?","context":["관계 형성"]}]},{"id":"S03","title":"폭력 의심 항목과 비밀 보장","section_id":"rapport","source_lines":[53,54],"cue":"(성폭력 환자는 대부분의 경우 서어 폭력을 당했다고 오기 때문에 바로 면담을 진행하면 됨)","ending":"의무기록은 법적으로 비밀이 보장됩니다.","rows":[{"source_line":53,"role":"spoken","text":"(성폭력 환자는 대부분의 경우 서어 폭력을 당했다고 오기 때문에 바로 면담을 진행하면 됨)","context":["폭력 의심"]},{"source_line":54,"role":"spoken","text":"말씀해 주시는 것이 많이 힘들고 어려우실 거라 생각되지만, 오늘 저에게 말씀하신 내용은 법적 제출이 필요한 경우와 치료 목적으로 불가피한 경우 외에는 비밀이 보장되며, 절대 누군가에게 누설되지 않습니다. 의무기록은 법적으로 비밀이 보장됩니다.","context":["비밀 보장"]}]},{"id":"S04","title":"걱정 표현","section_id":"rapport","source_lines":[55],"cue":"저는 현재 환자분의 상태가 많이 걱정되고, 환자분을 진심으로 도와드리고 싶습니다.","ending":"저에게 부담 없이 말씀해 주시면 제가 알고 있는 것들을 바탕으로 최선을 다해 돕도록 하겠습니다.","rows":[{"source_line":55,"role":"spoken","text":"저는 현재 환자분의 상태가 많이 걱정되고, 환자분을 진심으로 도와드리고 싶습니다. 저에게 부담 없이 말씀해 주시면 제가 알고 있는 것들을 바탕으로 최선을 다해 돕도록 하겠습니다.","context":["걱정 표현"]}]},{"id":"S05","title":"진료 과정·사진·진찰·증거물·동의","section_id":"rapport","source_lines":[56],"cue":"진료 과정에 대해 간단히 설명을 드리겠습니다.","ending":"동의하신다면 동의서에 서명해주세요.","rows":[{"source_line":56,"role":"spoken","text":"진료 과정에 대해 간단히 설명을 드리겠습니다.\n[면담] 먼저 환자분께 있었던 상황에 대해 질문들을 몇 가지 할 것입니다.\n[사진 촬영] 증거용으로 사진 촬영을 하게 됩니다.\n[신체 진찰] 또한 폭행당한 부위를 포함하여 전신과 생식기를 진찰하게 됩니다.\n[증거물 채취] 그리고 성적 접촉이 있었던 모든 부위에서 검체를 채취합니다. 폭행당한 지 72시간 이내이면 환자분 몸에 남아 있는 가해자의 증거를 찾을 가능성이 높기 때문입니다.\n증거물 채취를 원하지 않으면 하지 않을 것입니다. 그렇더라도 기본적인 병력에 대해 여쭙고 손상 부위 치료를 위해 필요한 검사와 치료는 시행하게 됩니다. 이 경우 의무기록지에 기록을 남기며, 역시 기밀이 보장됩니다. 어떠신가요?\n동의하신다면 동의서에 서명해주세요.","context":["진료 과정 설명"]}]},{"id":"S06","title":"동반자·존중·진료 시작 동의","section_id":"rapport","source_lines":[57],"cue":"진료 중에는 간호사, 상담사가 함꼐 있을 것이고, 원하시면 믿을 만한 분과 함께 지내면서 진료받을 수 있습니다.","ending":"진료를 시작해도 되겠습니까?","rows":[{"source_line":57,"role":"spoken","text":"진료 중에는 간호사, 상담사가 함꼐 있을 것이고, 원하시면 믿을 만한 분과 함께 지내면서 진료받을 수 있습니다.\n지금 자리는 편하신가요? 힘들면 언제든지 말씀해 주십시오.\n충격이 크실 터이기에 말씀하시기 어려울 수도 있습니다. 그러나 환자분의 신체적 피해를 줄이고 가해자에 대한 법적 처벌을 위한 기본 자료로 활용되기 때문에 정확하게 말씀해 주시면 좋겠습니다.\n진료를 시작해도 되겠습니까?","context":["존중"]}]},{"id":"S07","title":"사건 문진 · 누가/언제/어디서/횟수","section_id":"history","source_lines":[58,59,60,61],"cue":"가해자는 어떤 사람이었습니까?","ending":"-","rows":[{"source_line":58,"role":"spoken","text":"가해자는 어떤 사람이었습니까? (인상착의, 특징) 아는 사람이었나요?/몇 명이었나요?\n목격자가 있었나요?","context":["폭력 상황 및 가해자 정보 확인","누가"]},{"source_line":59,"role":"spoken","text":"언제 이런 일이 일어났나요?","context":["언제"]},{"source_line":60,"role":"spoken","text":"어디서, 어떤 상황에서 성 폭행이 발생하였나요?","context":["어디서"]},{"source_line":61,"role":"spoken","text":"-","context":["횟수"]}]},{"id":"S08","title":"성적 접촉 양상","section_id":"history","source_lines":[62],"cue":"성적 접촉이 어디에 있었는지 (질내 삽입, 구강/항문 성교) / 콘돔을 사용하였는지?","ending":"/ 물건을 사용해서 성 폭행을 하였는지?","rows":[{"source_line":62,"role":"spoken","text":"성적 접촉이 어디에 있었는지 (질내 삽입, 구강/항문 성교) / 콘돔을 사용하였는지? /\n가해자가 사정을 하였는지? 어디에 하였는지? / 물건을 사용해서 성 폭행을 하였는지?","context":["양상"]}]},{"id":"S09","title":"의식·위협·신체폭력과 가해자 정보","section_id":"history","source_lines":[63,64],"cue":"의식을 잃었는지?","ending":"폭력이 없을 때 평소 성격, 주변 사람들과의 관계, 술이나 약물 남용 여부, 폭행 후의 태도","rows":[{"source_line":63,"role":"spoken","text":"의식을 잃었는지? 기억이 있는지? (음료나 음식 먹고 중독 증상이 있거나 자고 일어나 보니 옷이 벗겨져 있는 등) / 무기나 도구를 통한 위협이 있었는지? / 다른 신체적 폭행으로 인한 고통이 있었는지?","context":["기타 폭력"]},{"source_line":64,"role":"spoken","text":"폭력이 없을 때 평소 성격, 주변 사람들과의 관계, 술이나 약물 남용 여부, 폭행 후의 태도","context":["가해자 정보\n*아는 사람"]}]},{"id":"S10","title":"사건 뒤 조치","section_id":"history","source_lines":[65],"cue":"사건 이후에 어떤 조치를 하셨나요?","ending":"샤워, 목욕, 좌욕 / 옷 갈아입기 / 이 닦기 / 대변, 소변 / 사후피임약","rows":[{"source_line":65,"role":"spoken","text":"사건 이후에 어떤 조치를 하셨나요?\n샤워, 목욕, 좌욕 / 옷 갈아입기 / 이 닦기 / 대변, 소변 / 사후피임약","context":["대처 확인"]}]},{"id":"S11","title":"신체·정신 상태","section_id":"history","source_lines":[66],"cue":"• 신체 증상 평가(환자가 호소하는 증상 중심으로) - 복통/흉통/두통/골절 • 정신적 상태 평가 - 우울/불안/불면/식욕 저하/집중력 저하/자살 사고/타살 사고(가해자 죽이고 싶음)","ending":"• 신체 증상 평가(환자가 호소하는 증상 중심으로) - 복통/흉통/두통/골절 • 정신적 상태 평가 - 우울/불안/불면/식욕 저하/집중력 저하/자살 사고/타살 사고(가해자 죽이고 싶음)","rows":[{"source_line":66,"role":"spoken","text":"• 신체 증상 평가(환자가 호소하는 증상 중심으로) - 복통/흉통/두통/골절\n• 정신적 상태 평가 - 우울/불안/불면/식욕 저하/집중력 저하/자살 사고/타살 사고(가해자 죽이고 싶음)","context":["의학적 상태 확인"]}]},{"id":"S12","title":"약·사회력·가정력","section_id":"history","source_lines":[67,68,69],"cue":"복용 중인 약물이 있으신가요?","ending":"어렸을 때 가정 폭력을 당하신 적이 있나요?","rows":[{"source_line":67,"role":"spoken","text":"복용 중인 약물이 있으신가요?","context":["약"]},{"source_line":68,"role":"spoken","text":"결혼 과정에서 문제가 있지는 않았나요?, 경제적 어려움을 겪고 있지는 않나요?의지할 만한 사람이 있나요?","context":["사"]},{"source_line":69,"role":"spoken","text":"어렸을 때 가정 폭력을 당하신 적이 있나요?","context":["가"]}]},{"id":"S13","title":"외상·과거력·월경·성관계","section_id":"history","source_lines":[70,71,72],"cue":"수술, 외상력","ending":"[생리] LMP, 주기, 규칙성 [성관계] 마지막 성관계, 피임 여부","rows":[{"source_line":70,"role":"spoken","text":"수술, 외상력","context":["외"]},{"source_line":71,"role":"spoken","text":"평소 앓고 있는 질환이 있으신가요? (당뇨, 고혈압, 간염, 결핵, 알레르기)\n이전에 정신건강의학과 진료 보신 적 있나요?","context":["과"]},{"source_line":72,"role":"spoken","text":"[생리] LMP, 주기, 규칙성\n[성관계] 마지막 성관계, 피임 여부","context":["여"]}]},{"id":"S14","title":"공통 신체진찰","section_id":"physical","source_lines":[73],"cue":"이제 신체진찰을 하려고 하는데요, 신체진찰 과정에서 신체 접촉과 노출이 있을 수 있습니다.","ending":"(앉아서) • G/A: 전반적인 영양, 위생 상태 확인 • 눈: 빈혈, 충혈 • 입: 구강 성교의 흔적 확인 • 사지: 외상 부위 확인","rows":[{"source_line":73,"role":"action","text":"이제 신체진찰을 하려고 하는데요, 신체진찰 과정에서 신체 접촉과 노출이 있을 수 있습니다. 괜찮으신가요? 앞서 말씀드린 대로 증거용 사진 촬영 및 증거물 채취를 시행히야 하며, 간호사를 동반하여 외음부 및 항문 진찰을 해야 합니다.\n(앉아서)\n• G/A: 전반적인 영양, 위생 상태 확인\n• 눈: 빈혈, 충혈\n• 입: 구강 성교의 흔적 확인\n• 사지: 외상 부위 확인","context":["P/E","공통"]}]},{"id":"S15","title":"산부인과 진찰과 DRE","section_id":"physical","source_lines":[74],"cue":"1.","ending":"DRE: 항문 열상 등 항문 성교의 증거 확인","rows":[{"source_line":74,"role":"action","text":"1. 산부인과 진찰 (골반 내진, 질분비물 검사)\n• 외음부 시진 및 내진, 체모나 정액 등 증거물 채취\n• 질분비물의 양상 확인 및 채취하여 도말검사 통해 감염 확인\n• Cervical motion tenderness 등 성병의 증거 확인\n2. DRE: 항문 열상 등 항문 성교의 증거 확인","context":["술기"]}]},{"id":"S16","title":"교육 · 공감과 폭력의 부당함","section_id":"education","source_lines":[75,76],"cue":"이런 일을 당하셔서 많이 놀라고 힘드셨겠습니다.","ending":"OOO님은 가치 있는 사람입니다.","rows":[{"source_line":75,"role":"spoken","text":"이런 일을 당하셔서 많이 놀라고 힘드셨겠습니다. 어떤 점이 가장 걱정되시나요?","context":["교육","공감"]},{"source_line":76,"role":"spoken","text":"그 누구도 이러한 대우를 받을 이유는 없습니다. OOO님은 가치 있는 사람입니다.","context":["폭력의 부당"]}]},{"id":"S17","title":"교육 · 임신 예방","section_id":"education","source_lines":[77],"cue":"우선 많이 걱정되는 부분일 임신 예방에 대해 알려드리겠습니다.","ending":"임신 진단 및 치료 계획","rows":[{"source_line":77,"role":"spoken","text":"우선 많이 걱정되는 부분일 임신 예방에 대해 알려드리겠습니다. 오늘 바로 임신반응검사를 해서 임신이 아닌 상태임을 확인한 후에 응급피임약을 처방해 드리도록 하겠습니다. 성교 후 72시간 이내에 복용해야 하고, 되도록 빨리 먹는 것이 좋습니다. 하지만 72시간 내에 복용해도 3%의 여성에서는 피임 실패가 있기도 합니다. 72시간이 넘어도 효과가 있으니 먹는 것이 좋습니다. 욕지기질이 나거나 토하는 부작용도 있을 수 있습니다. 임신 진단 및 치료 계획","context":["임신"]}]},{"id":"S18","title":"교육 · 성병 예방","section_id":"education","source_lines":[78],"cue":"성병에 대해서는 모든 환자에게 예방적 치료를 시행합니다.","ending":"성병 진단 및 치료 계획","rows":[{"source_line":78,"role":"spoken","text":"성병에 대해서는 모든 환자에게 예방적 치료를 시행합니다. 클라미디아, 임질, 편모충 등이 가장 흔하므로 예방할 수 있는 항생제를 드릴 예정입니다. 성병 진단 및 치료 계획","context":["성병 예방"]}]},{"id":"S19","title":"교육 · 에이즈 설명","section_id":"education","source_lines":[79],"cue":"에이즈는 한 번의 성관계로 감염될 확률이 높지 않습니다.","ending":"감염 여부는 6개월이 지나야 확인이 가능하므로 그 시기에 다시 검사 여부를 여쭙겠습니다.","rows":[{"source_line":79,"role":"spoken","text":"에이즈는 한 번의 성관계로 감염될 확률이 높지 않습니다. 항문성교가 감염 위험성이 가장 높으나 성교 1회당 0.008~0.032회 정도의 빈도로 알려져 있습니다. 성기 부위에 상처가 있거나 어려 번 성교했다면 감염 가능성이 더 높아질 수 있습니다. 바이러스 감염을 바로 확인할 수 있는 검사는 없습니다. 예방 치료는 비용이 비싸고 부작용이 있을 수 있으므로 모든 환자분에게 권하지는 않습니다. 감염 여부는 6개월이 지나야 확인이 가능하므로 그 시기에 다시 검사 여부를 여쭙겠습니다.","context":["에이즈"]}]},{"id":"S20","title":"교육 · 상처와 파상풍","section_id":"education","source_lines":[80],"cue":"상처 치료제를 드릴 것이고, 파상풍 예방주사를 맞지 않으셨다면이 또한 시행하도록 하겠습니다.","ending":"상처 치료제를 드릴 것이고, 파상풍 예방주사를 맞지 않으셨다면이 또한 시행하도록 하겠습니다.","rows":[{"source_line":80,"role":"spoken","text":"상처 치료제를 드릴 것이고, 파상풍 예방주사를 맞지 않으셨다면이 또한 시행하도록 하겠습니다.","context":["치료 방침"]}]},{"id":"S21","title":"교육 · 해바라기센터/재방문/마무리","section_id":"education","source_lines":[81],"cue":"국가에서 관리하는 해바라기 센터에 의뢰해 드리겠습니다.","ending":"추가적 검사 및 내원 일정 설명 더 궁금한 점 있으신가요?","rows":[{"source_line":81,"role":"spoken","text":"국가에서 관리하는 해바라기 센터에 의뢰해 드리겠습니다. 여기에서 추가로 필요한 조치도 취할 수 있고, 피해자에 대한 치료비 지원이나 소송 비용까지도 지원을 받으실 수 있습니다.\n상처 치료를 위해서 2주 후 다시 방문해 주세요. 추가적 검사 및 내원 일정 설명\n더 궁금한 점 있으신가요?","context":["해바라기 센터 및 마무리"]}]}],"audit":{"source_row_count":34,"mapped_source_rows":34}}},{"id":"suicide","label":"자살","packet":{"meta":{"title":"48. 자살 사고·시도"},"sections":[{"id":"overview","name":"개요·위험도","optional":false},{"id":"cases","name":"증례·범례","optional":false},{"id":"history","name":"면담·위험평가","optional":false},{"id":"physical","name":"신체진찰","optional":true},{"id":"education","name":"설명·입원·지지","optional":false}],"chunks":[{"id":"U01","title":"CPX 형태와 진찰 범위","section_id":"overview","source_lines":[5,6,7,8],"cue":"자살 CPX 증례는 크게 “죽고 싶어요”와 자살 시도 2가지로 나뉩니다.","ending":"실제 진찰은 완료된 상태라고 나올 수도 있고 하라고 할 수도 있는데, 전반적인 검사 및 사지에 상처가 있는지 시진 정도로 충분합니다.","rows":[{"source_line":5,"role":"concept","text":"자살 CPX 증례는 크게 “죽고 싶어요”와 자살 시도 2가지로 나뉩니다."},{"source_line":6,"role":"concept","text":"“죽고 싶어요”의 경우 “잠이 안 와요” 등 다른 CC인 경우도 있으나, 기출과 같이 지시문에 자살을 염두에 두고 의논하라는 단서가 있을 것으로 보입니다."},{"source_line":7,"role":"concept","text":"질문은 하나씩 하고 환자의 말과 생각의 속도에 맞춰야하며, \"다 잘될 겁니다. 걱정하지 마세요\" 이런 비현실적인 말은 도움이 되지 않음."},{"source_line":8,"role":"concept","text":"실제 진찰은 완료된 상태라고 나올 수도 있고 하라고 할 수도 있는데, 전반적인 검사 및 사지에 상처가 있는지 시진 정도로 충분합니다."}]},{"id":"U02","title":"두 유형의 기본 Flow","section_id":"overview","source_lines":[11,13,14],"cue":"자살 시도","ending":"① 환자 안심시키기 ② 자살에 대해 바로 문진 시행 가능 ③ 자살 사고 및 행동 평가","rows":[{"source_line":11,"role":"concept","text":"자살 시도","context":["“죽고 싶어요”"]},{"source_line":13,"role":"concept","text":"전체적인 flow는 다른 CC와 다르지 않음: 병력청취 → P/E → 교육","context":["Flow"]},{"source_line":14,"role":"concept","text":"① 환자 안심시키기\n② 자살에 대해 바로 문진 시행 가능\n③ 자살 사고 및 행동 평가","context":["① 주소 빠르게 파악\n② 비밀 보장, 공감\n③ 자살 사고 및 행동 평가~ (대본 참고)"]}]},{"id":"U03","title":"주의점과 입원 치료 거절","section_id":"overview","source_lines":[15,16],"cue":"자살 시도 CC에 비해 자살에 대해 쉽게 이야기하지 않기 때문에 “죽고 싶어요”가 아닌 주소, 예: 수면 등, 에 대해 어느 정도 이야기하다가 조심스럽게 자살 사고 및 행동에 대해 질문해야 함","ending":"① 거절 → 2번 이상 설득 ② 계속 거절 → 보호자의 24시간 감시 필요, 낮 병동 입원 치료 등 대체 방안 제시 / 재방문 강조","rows":[{"source_line":15,"role":"concept","text":"자살 시도 CC에 비해 자살에 대해 쉽게 이야기하지 않기 때문에 “죽고 싶어요”가 아닌 주소, 예: 수면 등, 에 대해 어느 정도 이야기하다가 조심스럽게 자살 사고 및 행동에 대해 질문해야 함","context":["주의"]},{"source_line":16,"role":"concept","text":"① 거절 → 2번 이상 설득\n② 계속 거절 → 보호자의 24시간 감시 필요, 낮 병동 입원 치료 등 대체 방안 제시 / 재방문 강조","context":["입원 치료 거절"]}]},{"id":"U04","title":"공통 태도와 시간 관리","section_id":"overview","source_lines":[17],"cue":"- 공감과 비밀 보장으로 상담 시작 - 스스로의 선택에 자책하지 말라고 하는 것이 중요 - 신체진찰이 없거나 간단하지만 시간이 부족한 경우 많으므로 시간 관리에 유념 - 엄숙하고 진지한 분위기 + SP 속도에 맞춰서 천천히 & 차분히 + 비판적인 말 X + 공감 & 정서적 지지","ending":"- 공감과 비밀 보장으로 상담 시작 - 스스로의 선택에 자책하지 말라고 하는 것이 중요 - 신체진찰이 없거나 간단하지만 시간이 부족한 경우 많으므로 시간 관리에 유념 - 엄숙하고 진지한 분위기 + SP 속도에 맞춰서 천천히 & 차분히 + 비판적인 말 X + 공감 & 정서적 지지","rows":[{"source_line":17,"role":"concept","text":"- 공감과 비밀 보장으로 상담 시작\n- 스스로의 선택에 자책하지 말라고 하는 것이 중요\n- 신체진찰이 없거나 간단하지만 시간이 부족한 경우 많으므로 시간 관리에 유념\n- 엄숙하고 진지한 분위기 + SP 속도에 맞춰서 천천히 & 차분히 + 비판적인 말 X + 공감 & 정서적 지지","context":["공통"]}]},{"id":"U05","title":"원인과 자살 위험 요인","section_id":"overview","source_lines":[20,22,23,24,25],"cue":"자살의 위험 요인","ending":"만성 통증 등","rows":[{"source_line":20,"role":"concept","text":"자살의 위험 요인","context":["원인","내용"]},{"source_line":22,"role":"concept","text":"① 이전 자살 시도\n② 정신 질환: 우울증, 조현병\n③ 알코올 남용\n④ 심각한 신체 질환/통증, 치료 실패/재발\n⑤ 심리사회적 스트레스\n⑥ 지지 체계 미비","context":["정신 질환","우울장애, 조현병, 알코올 의존 등"]},{"source_line":23,"role":"concept","text":"충동성, 절망감 등","context":["심리적 원인"]},{"source_line":24,"role":"concept","text":"가족의 붕괴, 실직 등","context":["사회적 원인"]},{"source_line":25,"role":"concept","text":"만성 통증 등","context":["신체 질환"]}]},{"id":"U06","title":"증례 1: 26/F 자살 시도","section_id":"cases","source_lines":[28],"cue":"증례1) 26/F \"자살 시도로 왔어요\"(응급실 통해 내원): 입원 거절하지만 여러 번 설득하면 고려하겠다고 함.","ending":"상담 치료 권유드리니 좋은 선생님으로 부탁한다고 함.","rows":[{"source_line":28,"role":"spoken","text":"증례1) 26/F \"자살 시도로 왔어요\"(응급실 통해 내원): 입원 거절하지만 여러 번 설득하면 고려하겠다고 함. 비밀은 보장되나 가족에게 말하면 치료 효과 좋다고 하니 고민하다 말해달라고 함. 상담 치료 권유드리니 좋은 선생님으로 부탁한다고 함."}]},{"id":"U07","title":"증례 2: 17/F 불면·자해","section_id":"cases","source_lines":[29],"cue":"증례2) 17/F, “잠이 안 와요.(엄마가 가라고 했어요.)”: 제시문에 자해를 해서 내원하였으며 신체진찰을 하라고 쓰여져있음.","ending":"PPI 쌓기 쉽지 않지만 대답은 잘 해줌","rows":[{"source_line":29,"role":"spoken","text":"증례2) 17/F, “잠이 안 와요.(엄마가 가라고 했어요.)”: 제시문에 자해를 해서 내원하였으며 신체진찰을 하라고 쓰여져있음. 신체진찰 시 왼쪽 팔목에 빨갛게 색칠되어 있음. 비밀 보장 한 두번 해야 이야기해주기 시작함. PPI 쌓기 쉽지 않지만 대답은 잘 해줌"}]},{"id":"U08","title":"증례 3·4·7 반응","section_id":"cases","source_lines":[30,31,32],"cue":"증례3) 19/F, “자살 시도를 했어요(타이레놀 과다복용)”: 가족에게 전달하는 것은 싫어하나, 입원 치료에 관련해서는 부모님과 대신 말해달라고 함.","ending":"증례7) 40/F, “죽고 싶은 생각이 들어요.”: “입원을 꼭 해야 하나요?","rows":[{"source_line":30,"role":"spoken","text":"증례3) 19/F, “자살 시도를 했어요(타이레놀 과다복용)”: 가족에게 전달하는 것은 싫어하나, 입원 치료에 관련해서는 부모님과 대신 말해달라고 함."},{"source_line":31,"role":"spoken","text":"증례4) 51/M, “죽고 싶은 생각이 들어요.”: 입원 권유 계속 거절"},{"source_line":32,"role":"spoken","text":"증례7) 40/F, “죽고 싶은 생각이 들어요.”: “입원을 꼭 해야 하나요?"}]},{"id":"U09","title":"색상·추가 문구 범례","section_id":"cases","source_lines":[36,37],"cue":"*암기 관련 내용은 파란색, 한끝 체크리스트에서 빨간색으로 강조된 부분과 한끝 총론이 일치하는 부분은 빨간색","ending":"*그 외에 ‘+) ~’로 표시한 부분은 한끝 체크리스트 또는 기본진료수행지침에는 있으나 한끝 총론에는 없는 내용","rows":[{"source_line":36,"role":"spoken","text":"*암기 관련 내용은 파란색, 한끝 체크리스트에서 빨간색으로 강조된 부분과 한끝 총론이 일치하는 부분은 빨간색"},{"source_line":37,"role":"spoken","text":"*그 외에 ‘+) ~’로 표시한 부분은 한끝 체크리스트 또는 기본진료수행지침에는 있으나 한끝 총론에는 없는 내용"}]},{"id":"U10","title":"초기 환자/의사 관계 형성","section_id":"history","source_lines":[41],"cue":"지금부터 약 10분 정도 동안 OOO씨가 겪은 일에 대해서 면담을 하려고 하는데 괜찮으신가요?","ending":"면담 중 힘드시면 언제든 부담없이 말씀해 주세요.","rows":[{"source_line":41,"role":"spoken","text":"지금부터 약 10분 정도 동안 OOO씨가 겪은 일에 대해서 면담을 하려고 하는데 괜찮으신가요? <허락 구하기>\n자살 시도를 하여 내원하신 걸로 알고 있습니다. 괜찮으시다면 그 부분에 대해서 먼저 얘기해봐도 될까요?\n우선 모든 상담 내용은 비밀이 보장되니 걱정하지 않으셔도 된다고 말씀드리고 싶습니다. 조금 힘들더라도 대답해 주시면 감사하겠습니다. 비밀 보장\n저는 진심으로 OOO씨가 걱정되기에 전문적인 입장에서 의학적으로 최대한 도움을 드리고 싶습니다.\n면담 중 힘드시면 언제든 부담없이 말씀해 주세요.","context":["환자/의사 관계 형성"]}]},{"id":"U11","title":"이번 자살 시도: When, How, Why, How","section_id":"history","source_lines":[42],"cue":"When, How, Why, How 언제 이런 일이 발생했나요?","ending":"/ 어떻게 내원하시게 되었나요?","rows":[{"source_line":42,"role":"spoken","text":"When, How, Why, How\n언제 이런 일이 발생했나요? / 어떻게 자살을 시도하셨나요? / 특별한 계기가 있었나요? / 어떻게 내원하시게 되었나요?","context":["이번 자살 시도"]}]},{"id":"U12","title":"자살 사고 및 행동 평가: TOP AI","section_id":"history","source_lines":[43],"cue":"TOP AI Trigger: 자살 생각을 하게 된 계기나 사건이 있을까요?","ending":"자살 사고 빈도","rows":[{"source_line":43,"role":"spoken","text":"TOP AI\nTrigger: 자살 생각을 하게 된 계기나 사건이 있을까요?\nOnset: 언제부터 자살에 대한 생각을 하셨나요? 자살 사고 Onset\nPlan: 자살 계획이 있으셨나요? 자살 계획\nAttempt: 이전에도 자살 시도를 하신 적이 있으신가요? → 어떤 식으로 시도하셨나요? 자살 시도 여부, 당시 경험과 상황\nIdea: 자살에 대한 생각을 평소에 계속 하셨나요? 몇 차례 하셨나요? 자살 사고 빈도","context":["자살 사고 및 행동 평가"]}]},{"id":"U13","title":"병전 성격과 주변 관계","section_id":"history","source_lines":[44,45],"cue":"평소 성격은 어떠셨나요?","ending":"주위에 도움을 줄 수 있는 사람 +) 주변에 폭력을 가하는 사람이 있나요?","rows":[{"source_line":44,"role":"spoken","text":"평소 성격은 어떠셨나요? 사건 전후로 성격이 달라지셨나요? 평소 성격","context":["병전 성격"]},{"source_line":45,"role":"spoken","text":"가족 관계는 어떠셨나요? 친구 관계는 어떠신가요? 가족/대인 관계\n주변에 도움을 줄 만한 분이 있나요? 주위에 도움을 줄 수 있는 사람\n+) 주변에 폭력을 가하는 사람이 있나요?","context":["주변 관계"]}]},{"id":"U14","title":"중간 환자/의사 관계 형성","section_id":"history","source_lines":[46],"cue":"많이 힘드셨겠군요.","ending":"힘드시다면 말씀하셔도 됩니다.","rows":[{"source_line":46,"role":"spoken","text":"많이 힘드셨겠군요. 자살이라는 어려운 선택을 하실 정도로 많이 힘드셨을 것 같습니다. 공감\n하지만 병원에 오신 건 정말 잘하셨습니다. 이렇게 오셨으니 최대한 다 도와드리고자 합니다.\n도와드리기에 앞서 OOO씨의 상태를 정확히 판단해야 최선의 도움을 드릴 수 있을 것 같습니다. 몇 가지 질문을 더 드려도 될까요? 힘드시다면 말씀하셔도 됩니다.","context":["환자/의사 관계 형성"]}]},{"id":"U15","title":"우울 증상 평가","section_id":"history","source_lines":[47],"cue":"MDD 우울 척도 평가 우울 증상 우울, 흥미 감소, 식욕 감소, 수면 변화, 피로감, 집중력/기억력 감소, 무가치함/죄책감/정신 운동 초조, 자살 1.","ending":"불안하고 초조하신가요?}","rows":[{"source_line":47,"role":"spoken","text":"MDD 우울 척도 평가 우울 증상\n우울, 흥미 감소, 식욕 감소, 수면 변화, 피로감, 집중력/기억력 감소, 무가치함/죄책감/정신 운동 초조, 자살\n1. 하루 종일 우울하신가요?\n2. 삶에 대한 흥미가 없으신가요?\n3. 잠은 잘 주무시나요?\n4. 식사는 잘하고 계신가요?\n5. 피곤하신가요?\n6. 집중력이 떨어지거나 기억력이 떨어지셨나요?\n7. 삶에 대한 죄책감을 느끼시나요?\n8. 불안하고 초조하신가요?}","context":["우울 증상 평가"]}]},{"id":"U16","title":"정신과적 장애와 신체 증상","section_id":"history","source_lines":[48,49],"cue":"환청/환시: 헛것을 보거나 평소에 들리지 않던 소리를 들은 적이 있나요?","ending":"환자가 호소하는 증상 중심으로 → 복통/통증/두통/골절 특히 교액의 경우 두통, 호흡곤란, 목 이물감 등 확인","rows":[{"source_line":48,"role":"spoken","text":"환청/환시: 헛것을 보거나 평소에 들리지 않던 소리를 들은 적이 있나요? 정신병적 증상\n조증: 기분이 갑자기 확 좋아진 적은 없나요?\n충동성: 평소 감정 조절에 어려움이 있나요? 화가 나서 참을 수 없던 때가 있나요?","context":["정신과적 장애"]},{"source_line":49,"role":"spoken","text":"환자가 호소하는 증상 중심으로 → 복통/통증/두통/골절\n특히 교액의 경우 두통, 호흡곤란, 목 이물감 등 확인","context":["신체 증상 평가"]}]},{"id":"U17","title":"과거력 평가: 약사가외과여","section_id":"history","source_lines":[50],"cue":"약사가외과여 약: 복용 중인 약물이 있나요?","ending":"여: 월경 주기/규칙성","rows":[{"source_line":50,"role":"spoken","text":"약사가외과여\n약: 복용 중인 약물이 있나요?\n사: 술, 담배, 직업, 운동, 커피\n가: 가족 중 정신과적 질환 있으신 분 있나요?\n가족 중 자살 시도를 하셨던 분 있나요? 정신과 질환/자살 가족력\n외: 자살 시도로 인해 다치거나 수술/입원하신 적이 있나요?\n과: 이전에 정신과적으로 진단받았거나 치료받은 적이 있으신가요? 정신과 질환 과거력\n따로 앓고 계신 질병이 있을까요?\n여: 월경 주기/규칙성","context":["과거력 평가"]}]},{"id":"U18","title":"신체 검진","section_id":"physical","source_lines":[54],"cue":"(대부분 할 필요는 없는 것으로 주어짐) (한다면) 손, 발, 허벅지, 다리 등 주로 베이는 부위 시진","ending":"(대부분 할 필요는 없는 것으로 주어짐) (한다면) 손, 발, 허벅지, 다리 등 주로 베이는 부위 시진","rows":[{"source_line":54,"role":"action","text":"(대부분 할 필요는 없는 것으로 주어짐)\n(한다면) 손, 발, 허벅지, 다리 등 주로 베이는 부위 시진","context":["신체 검진"]}]},{"id":"U19","title":"환자 상태 설명","section_id":"education","source_lines":[55],"cue":"어려운 상황에서 면담에 응해주셔서 감사드립니다.","ending":"- 우울증 상태에 있기 때문에 자살에 대해 더 생각하실 수 있습니다.","rows":[{"source_line":55,"role":"spoken","text":"어려운 상황에서 면담에 응해주셔서 감사드립니다. 이러한 상황에 처하게 된 것은 절대 OOO씨의 잘못이 아니니 스스로의 선택에 대해 자책하지 않으셨으면 합니다.\n\n환자의 스트레스 상태/우울증 등 정신과적 상태\n예)\n- 지금까지의 문진을 종합해 보았을 때 하루 종일 우울하시고 잠도 잘 못 주무시는 것을 보아 OOO씨께서는 우울증 소견이 있으신 듯 합니다.\n- 자살 위험도가 높은 정신과적 응급이라고 할 수 있습니다.\n- 우울증 상태에 있기 때문에 자살에 대해 더 생각하실 수 있습니다.","context":["환자 상태"]}]},{"id":"U20","title":"추가 검사","section_id":"education","source_lines":[56],"cue":"우울척도검사, 혈액검사, 간기능검사 등","ending":"우울척도검사, 혈액검사, 간기능검사 등","rows":[{"source_line":56,"role":"spoken","text":"우울척도검사, 혈액검사, 간기능검사 등","context":["+) 검사"]}]},{"id":"U21","title":"치료 계획과 입원 거절 대응","section_id":"education","source_lines":[57],"cue":"“죽고 싶어요” → 항우울제, 상담 치료, 입원 치료(필요한 경우) 우울증은 약으로 치료가 가능합니다.","ending":"또한 이후에 반드시 정신과 외래에 방문하시길 바라겠습니다.","rows":[{"source_line":57,"role":"spoken","text":"“죽고 싶어요” → 항우울제, 상담 치료, 입원 치료(필요한 경우)\n우울증은 약으로 치료가 가능합니다. 스트레스를 해결하고 우울증을 치료하는 데 도움을 받을 수 있도록 정신건강의학과 진료를 바로 연결해 드리겠습니다.\n“자살 시도” → 항우울제, 상담 치료, 입원 치료\n이런 경우 혼자 지내시면 더욱 우울해지고 안 좋은 생각만 들게 되는데, 입원을 하면 저희가 가까이에서 OOO님을 지켜보며 최선의 도움을 드릴 수 있을 것 같습니다. 입원 치료에 대해서 어떻게 생각하시나요?\n입원 치료라는 것에 대해 부담을 가지실 수 있습니다만, 몇 일 쉬는 동안 차츰 치료를 병행하시면 우울감이나 자살에 대한 생각과 관련된 측면에서 좋은 결과가 있으리라 봅니다. 마음을 추스르는 시간을 갖는 게 좋을 것 같은데 어떠신가요? 입원 치료 필요성 설명/권유\n+) 면담 치료 계획, 도움이 되는 생활 습관 및 치료 방법, 약물 복용법(4주 이상 꾸준히 복용해야 합니다)\n\n* 입원 거절 → 낮병동 입원 권유\n두 차례의 권유에도 입원을 거절한다면 낮병동 입원 권유\n입원을 하지 않고 약물만 처방받고자 하신다면 보호자의 통제하에 단기간 처방해드릴 것이며, 보호자분께서는 OOO님과 항상 곁에 계셔 자살시도를 하지 않는지 지켜봐주시는 것이 필요합니다. 보호자분께서 상황이 어려우시다변 잠시 낮병동에 입원하시는 것도 권유드립니다. 또한 이후에 반드시 정신과 외래에 방문하시길 바라겠습니다.","context":["치료 계획"]}]},{"id":"U22","title":"입원 치료 필요성","section_id":"education","source_lines":[58],"cue":"자살 시도를 한 경우에는 이후 자살의 위험성이 매우 높으므로 반드시 입원 치료를 받는 것이 필요함을 강조 자살 시도 계획이 없더라도 정신 질환, 우울증, 정신병적 증상 등이 의심될 경우 검사 및 경과 관찰을 위해 입원이 필요할 수 있음을 설명 입원을 하지 않고 불면, 기분 변화 등에 대해 약을 처방하게 될 경우 보호자의 통제 하에 단기간 처방하며, 정신과 외래에 반드시 방문하도록 교육 가족, 친구 등의 보호자 참여 교육 예) 환자분께서 현재 자살에 대해서 생각하고 있으며, 이전에도 시도해 보신 적이 있으므로 환자분을 위해 입원하셔서 안정을 취하는 것이 필요합니다.","ending":"자살 시도를 한 경우에는 이후 자살의 위험성이 매우 높으므로 반드시 입원 치료를 받는 것이 필요함을 강조 자살 시도 계획이 없더라도 정신 질환, 우울증, 정신병적 증상 등이 의심될 경우 검사 및 경과 관찰을 위해 입원이 필요할 수 있음을 설명 입원을 하지 않고 불면, 기분 변화 등에 대해 약을 처방하게 될 경우 보호자의 통제 하에 단기간 처방하며, 정신과 외래에 반드시 방문하도록 교육 가족, 친구 등의 보호자 참여 교육 예) 환자분께서 현재 자살에 대해서 생각하고 있으며, 이전에도 시도해 보신 적이 있으므로 환자분을 위해 입원하셔서 안정을 취하는 것이 필요합니다.","rows":[{"source_line":58,"role":"spoken","text":"자살 시도를 한 경우에는 이후 자살의 위험성이 매우 높으므로 반드시 입원 치료를 받는 것이 필요함을 강조\n\n자살 시도 계획이 없더라도 정신 질환, 우울증, 정신병적 증상 등이 의심될 경우 검사 및 경과 관찰을 위해 입원이 필요할 수 있음을 설명\n입원을 하지 않고 불면, 기분 변화 등에 대해 약을 처방하게 될 경우 보호자의 통제 하에 단기간 처방하며, 정신과 외래에 반드시 방문하도록 교육 가족, 친구 등의 보호자 참여 교육\n예) 환자분께서 현재 자살에 대해서 생각하고 있으며, 이전에도 시도해 보신 적이 있으므로 환자분을 위해 입원하셔서 안정을 취하는 것이 필요합니다.","context":["입원 치료 필요성"]}]},{"id":"U23","title":"현실적·정서적 지지","section_id":"education","source_lines":[59],"cue":"정서적 지지 우울증은 약으로 치료가 가능하고, 스트레스 해소에 도움을 줄 것 가족에게 현재 상황을 이야기하는 것이 어떤지 물어보기 효과 더 좋다는 것 알려주기 → 알리기 싫어하는 경우 비밀 보호 보장.","ending":"환자의 불편함과 우울함에 대한 공감 공감 +) 자살 이외의 다른 해결 방법이 있음을 설명 +) 필요 시 보건복지부 콜센터 129, 정신건강증신센터, 자살예방센터 안내 +) 항우울제는 효과가 나타나려면 2-3주 소모되기 때문에 꾸준히 복용 필요","rows":[{"source_line":59,"role":"spoken","text":"정서적 지지\n우울증은 약으로 치료가 가능하고, 스트레스 해소에 도움을 줄 것\n가족에게 현재 상황을 이야기하는 것이 어떤지 물어보기\n효과 더 좋다는 것 알려주기 → 알리기 싫어하는 경우 비밀 보호 보장.\n환자의 불편함과 우울함에 대한 공감 공감\n+) 자살 이외의 다른 해결 방법이 있음을 설명\n+) 필요 시 보건복지부 콜센터 129, 정신건강증신센터, 자살예방센터 안내\n+) 항우울제는 효과가 나타나려면 2-3주 소모되기 때문에 꾸준히 복용 필요","context":["현실적 지지"]}]}],"audit":{"source_row_count":38,"mapped_source_rows":38}}}]};</script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const topics = APP.topics;
  const roleNames = {
    spoken: '말할 원문',
    action: '진찰 행동',
    concept: '핵심 개념',
    placeholder: '원문 빈칸',
    asset: '원문 이미지'
  };
  let activeTopic = null;
  let packet = null;
  let chunks = [];
  let sections = [];
  let state = null;
  let revealed = false;
  let resetArmed = false;
  let resetTimer = null;

  function storageKey(topicId) {
    // This page replaces the deployed CC45 trainer at the same URL.
    if (topicId === 'substance-use') return 'cpx45-fullscript-progress-v2';
    return `cpx-memorize-four-topic:v1:${encodeURIComponent(topicId)}`;
  }

  function canonicalTopicId(value) {
    if (!value) return null;
    const normalized = value.replaceAll('_', '-');
    return topics.some(topic => topic.id === normalized) ? normalized : null;
  }

  function writeRoute(topicId, mode = 'push') {
    if (mode === 'none') return;
    const url = new URL(window.location.href);
    if (topicId) url.searchParams.set('topic', topicId);
    else url.searchParams.delete('topic');
    try {
      history[mode === 'replace' ? 'replaceState' : 'pushState'](
        { topic: topicId || null }, '', url
      );
    } catch (_) {}
  }

  function loadState(topic) {
    const topicChunks = topic.packet.chunks;
    const validIds = new Set(topicChunks.map(chunk => chunk.id));
    let loaded = {};
    try { loaded = JSON.parse(localStorage.getItem(storageKey(topic.id)) || '{}'); } catch (_) {}
    if (!loaded || typeof loaded !== 'object' || Array.isArray(loaded)) loaded = {};
    const statuses = {};
    if (typeof loaded.statuses === 'object' && loaded.statuses && !Array.isArray(loaded.statuses)) {
      Object.entries(loaded.statuses).forEach(([id, value]) => {
        if (validIds.has(id) && (value === 'mastered' || value === 'redo')) statuses[id] = value;
      });
    }
    const index = Math.max(0, Math.min(topicChunks.length - 1, Number(loaded.index) || 0));
    return {
      index,
      statuses,
      view: loaded.view === 'full' ? 'full' : 'recall',
      bridge: loaded.bridge === true
    };
  }

  function persist() {
    if (!activeTopic || !state) return;
    try {
      localStorage.setItem(storageKey(activeTopic.id), JSON.stringify({
        index: state.index,
        statuses: state.statuses,
        view: state.view,
        bridge: state.bridge
      }));
    } catch (_) {}
  }

  function current() { return chunks[state.index]; }
  function currentSection() { return sections.find(section => section.id === current().section_id); }
  function sectionChunks(sectionId) { return chunks.filter(chunk => chunk.section_id === sectionId); }
  function currentSectionStep() { return sectionChunks(current().section_id).indexOf(current()) + 1; }

  function firstIncompleteIndex(sectionId) {
    const candidates = chunks.map((chunk, index) => ({ chunk, index })).filter(item => item.chunk.section_id === sectionId);
    const open = candidates.find(item => state.statuses[item.chunk.id] !== 'mastered');
    return (open || candidates[0]).index;
  }

  function clearResetArm() {
    clearTimeout(resetTimer);
    resetArmed = false;
    ['resetProgress', 'mobileResetProgress'].forEach(id => {
      $(id).setAttribute('aria-pressed', 'false');
      $(id).textContent = '이 주제 진행 기록 초기화';
    });
  }

  function clearTrainerDom() {
    $('sectionTabs').replaceChildren();
    $('chunkNav').replaceChildren();
    $('mobileJump').replaceChildren();
    $('answerContent').replaceChildren();
    $('fullContent').replaceChildren();
    ['chunkTitle', 'cueText', 'previousEnding', 'currentBeginning', 'sequencePrevious', 'sequenceNext', 'fullTitle', 'fullCoverage'].forEach(id => { $(id).textContent = ''; });
  }

  function topicProgress(topic) {
    const saved = loadState(topic);
    const mastered = topic.packet.chunks.filter(chunk => saved.statuses[chunk.id] === 'mastered').length;
    return { mastered, total: topic.packet.chunks.length };
  }

  function renderHomeCards() {
    const cards = topics.map((topic, index) => {
      const progress = topicProgress(topic);
      const button = document.createElement('button');
      button.className = 'topic-card';
      button.type = 'button';
      button.dataset.topicId = topic.id;
      button.setAttribute('aria-label', `${topic.label} 통암기 시작, ${progress.total}개 중 ${progress.mastered}개 완료`);
      const number = document.createElement('span');
      number.className = 'topic-number';
      number.textContent = String(index + 1).padStart(2, '0');
      const label = document.createElement('span');
      label.className = 'topic-label';
      label.textContent = topic.label;
      const meta = document.createElement('span');
      meta.className = 'topic-meta';
      meta.textContent = `${topic.packet.sections.length}개 구역 · ${progress.total}개 암기 단위`;
      const progressNode = document.createElement('span');
      progressNode.className = 'topic-progress';
      const rule = document.createElement('span');
      rule.className = 'topic-progress-rule';
      const value = document.createElement('span');
      value.textContent = `${progress.mastered} / ${progress.total} 완료`;
      progressNode.append(rule, value);
      button.append(number, label, meta, progressNode);
      button.addEventListener('click', () => enterTopic(topic.id));
      return button;
    });
    $('topicGrid').replaceChildren(...cards);
  }

  function showHome(focus = true, historyMode = 'push') {
    clearResetArm();
    activeTopic = null;
    packet = null;
    chunks = [];
    sections = [];
    state = null;
    revealed = false;
    clearTrainerDom();
    document.body.classList.add('home-active');
    document.body.classList.remove('trainer-active');
    $('homeScreen').hidden = false;
    $('trainerScreen').hidden = true;
    $('homeButton').hidden = true;
    $('progressSummary').hidden = true;
    $('sourceLock').hidden = true;
    $('brand').textContent = 'CPX 통암기 리허설';
    renderHomeCards();
    document.title = 'CPX 상담 4종 · 통암기 리허설';
    writeRoute(null, historyMode);
    window.scrollTo({ top: 0, behavior: 'auto' });
    if (focus) requestAnimationFrame(() => $('homeTitle').focus({ preventScroll: true }));
  }

  function enterTopic(topicId, options = {}) {
    const canonicalId = canonicalTopicId(topicId);
    const topic = topics.find(item => item.id === canonicalId);
    if (!topic) return;
    const focus = options.focus !== false;
    const historyMode = options.historyMode || 'push';
    clearResetArm();
    clearTrainerDom();
    activeTopic = topic;
    packet = topic.packet;
    chunks = packet.chunks;
    sections = packet.sections;
    state = loadState(topic);
    revealed = false;
    document.body.classList.remove('home-active');
    document.body.classList.add('trainer-active');
    $('homeScreen').hidden = true;
    $('trainerScreen').hidden = false;
    $('homeButton').hidden = false;
    $('progressSummary').hidden = false;
    $('sourceLock').hidden = false;
    $('brand').textContent = topic.label;
    buildFullView();
    render();
    document.title = `${topic.label} · CPX 통암기`;
    writeRoute(topic.id, historyMode);
    window.scrollTo({ top: 0, behavior: 'auto' });
    if (focus) requestAnimationFrame(() => $('trainerScreen').focus({ preventScroll: true }));
  }

  function routeFromLocation(focus = false) {
    const url = new URL(window.location.href);
    const requested = url.searchParams.get('topic');
    const topicId = canonicalTopicId(requested);
    if (topicId) {
      enterTopic(topicId, { focus, historyMode: 'none' });
      if (requested !== topicId) writeRoute(topicId, 'replace');
    } else {
      showHome(focus, 'none');
      if (requested !== null) writeRoute(null, 'replace');
    }
  }

  function makeSourceRow(row) {
    const wrapper = document.createElement('div');
    wrapper.className = 'source-row';
    wrapper.dataset.role = row.role;
    wrapper.dataset.sourceLine = String(row.source_line);
    const context = document.createElement('div');
    context.className = 'source-context';
    const role = document.createElement('span');
    role.className = 'source-role';
    role.textContent = roleNames[row.role] || '원문';
    context.appendChild(role);
    if (Array.isArray(row.context) && row.context.length) {
      const labels = document.createElement('span');
      labels.textContent = row.context.join(' · ');
      context.appendChild(labels);
    }
    const line = document.createElement('span');
    line.className = 'source-line-number';
    line.textContent = `원문 ${row.source_line}행`;
    context.appendChild(line);
    wrapper.appendChild(context);
    if (row.role === 'asset') {
      const image = document.createElement('img');
      image.className = 'source-image';
      image.src = row.asset_data_url || row.asset_src || packet.core_image_data_url;
      image.alt = row.alt || row.text || `${activeTopic.label} 원문 이미지`;
      wrapper.appendChild(image);
    } else {
      const text = document.createElement('p');
      text.className = 'source-text';
      text.textContent = row.text;
      wrapper.appendChild(text);
    }
    return wrapper;
  }

  function renderSectionTabs() {
    const active = current().section_id;
    const buttons = sections.map(section => {
      const button = document.createElement('button');
      button.className = 'section-tab';
      button.type = 'button';
      button.role = 'tab';
      button.setAttribute('aria-selected', section.id === active ? 'true' : 'false');
      const list = sectionChunks(section.id);
      const mastered = list.filter(chunk => state.statuses[chunk.id] === 'mastered').length;
      const name = document.createElement('span');
      name.textContent = section.name;
      const count = document.createElement('small');
      count.textContent = `${mastered} / ${list.length}${section.optional ? ' · 선택' : ''}`;
      button.append(name, count);
      button.addEventListener('click', () => go(firstIncompleteIndex(section.id)));
      return button;
    });
    $('sectionTabs').replaceChildren(...buttons);
  }

  function renderSidebar() {
    const chunk = current();
    const section = currentSection();
    const list = sectionChunks(chunk.section_id);
    const step = currentSectionStep();
    $('sidebarTitle').textContent = `${section.name} 순서`;
    $('sidebarCount').textContent = `${step} / ${list.length}`;
    const buttons = list.map(item => {
      const button = document.createElement('button');
      button.className = 'chunk-nav-button';
      button.type = 'button';
      button.dataset.status = state.statuses[item.id] || 'new';
      if (item.id === chunk.id) button.setAttribute('aria-current', 'step');
      const id = document.createElement('span');
      id.className = 'chunk-nav-id';
      id.textContent = item.id;
      const title = document.createElement('span');
      title.className = 'chunk-nav-title';
      title.textContent = item.title;
      const status = document.createElement('span');
      status.className = 'chunk-nav-status';
      status.setAttribute('aria-hidden', 'true');
      button.append(id, title, status);
      button.addEventListener('click', () => go(chunks.indexOf(item)));
      return button;
    });
    $('chunkNav').replaceChildren(...buttons);
    const options = list.map(item => {
      const option = document.createElement('option');
      option.value = String(chunks.indexOf(item));
      option.textContent = `${item.id} · ${item.title}`;
      option.selected = item.id === chunk.id;
      return option;
    });
    $('mobileJump').replaceChildren(...options);
  }

  function renderProgress() {
    const mastered = chunks.filter(chunk => state.statuses[chunk.id] === 'mastered').length;
    const percent = chunks.length ? mastered / chunks.length * 100 : 0;
    const list = sectionChunks(current().section_id);
    $('progressLabel').textContent = `${activeTopic.label} · ${currentSection().name} ${currentSectionStep()} / ${list.length}`;
    $('progressFill').style.width = `${percent}%`;
    const audit = packet.audit;
    const mapped = audit.mapped_source_rows ?? audit.mapped_semantic_lines;
    const expected = audit.source_row_count ?? audit.semantic_source_lines ?? audit.topic_semantic_source_lines;
    $('sourceLock').textContent = `전체 ${chunks.length}개 · 완료 ${mastered}개 · 원문 ${mapped}/${expected}`;
  }

  function renderAnswer() {
    const chunk = current();
    $('answerContent').replaceChildren(...chunk.rows.map(makeSourceRow));
    $('answerContent').classList.toggle('visible', revealed);
    $('answerPlaceholder').hidden = revealed;
    $('revealButton').textContent = revealed ? '원문 가리기' : '원문 보기';
    $('revealButton').setAttribute('aria-pressed', revealed ? 'true' : 'false');
  }

  function renderRecall() {
    const chunk = current();
    const list = sectionChunks(chunk.section_id);
    const previous = chunks[state.index - 1] || null;
    const next = chunks[state.index + 1] || null;
    $('chunkPosition').textContent = `${chunk.id} · ${currentSection().name} ${currentSectionStep()} / ${list.length}`;
    $('chunkSourceLines').textContent = `원문 ${chunk.source_lines.length}행`;
    $('chunkTitle').textContent = chunk.title;
    $('cueText').textContent = chunk.cue;
    $('answerMeta').textContent = `원문 ${chunk.source_lines.join(' · ')}행`;
    $('previousEnding').textContent = previous ? previous.ending : '처음부터 시작합니다.';
    $('currentBeginning').textContent = chunk.cue;
    $('bridgePanel').classList.toggle('visible', state.bridge);
    $('bridgeToggle').setAttribute('aria-pressed', state.bridge ? 'true' : 'false');
    $('bridgeToggle').textContent = state.bridge ? '문장 연결 숨기기' : '문장 연결 보기';
    $('previousButton').disabled = state.index === 0;
    $('nextButton').disabled = state.index === chunks.length - 1;
    $('sequencePrevious').textContent = previous ? `${previous.id} · ${previous.title}` : '시작';
    $('sequenceCurrent').textContent = `${state.index + 1} / ${chunks.length}`;
    $('sequenceNext').textContent = next ? `${next.id} · ${next.title}` : '완료';
    renderAnswer();
  }

  function renderView() {
    const recall = state.view === 'recall';
    $('recallTab').setAttribute('aria-selected', recall ? 'true' : 'false');
    $('fullTab').setAttribute('aria-selected', recall ? 'false' : 'true');
    $('recallView').hidden = !recall;
    $('fullView').classList.toggle('visible', !recall);
    $('mobileJump').hidden = !recall;
    $('bridgeToggle').hidden = !recall;
  }

  function render() {
    if (!activeTopic) return;
    renderProgress();
    renderSectionTabs();
    renderSidebar();
    renderRecall();
    renderView();
    persist();
  }

  function go(index) {
    if (!activeTopic) return;
    state.index = Math.max(0, Math.min(chunks.length - 1, index));
    revealed = false;
    state.view = 'recall';
    clearResetArm();
    render();
    if (window.matchMedia('(max-width: 760px)').matches) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function mark(status) {
    if (!activeTopic) return;
    state.statuses[current().id] = status;
    if (state.index < chunks.length - 1) go(state.index + 1);
    else render();
  }

  function buildFullView() {
    const nodes = [];
    sections.forEach(section => {
      const sectionNode = document.createElement('section');
      sectionNode.className = 'full-section';
      sectionNode.id = `full-${activeTopic.id}-${section.id}`;
      const title = document.createElement('div');
      title.className = 'full-section-title';
      const h2 = document.createElement('h2');
      h2.textContent = section.name;
      const count = document.createElement('span');
      count.textContent = `${sectionChunks(section.id).length}개 단위${section.optional ? ' · 원문상 생략 가능' : ''}`;
      title.append(h2, count);
      sectionNode.appendChild(title);
      sectionChunks(section.id).forEach(chunk => {
        const article = document.createElement('article');
        article.className = 'full-chunk';
        article.id = `full-${activeTopic.id}-${chunk.id}`;
        const head = document.createElement('header');
        head.className = 'full-chunk-head';
        const id = document.createElement('div');
        id.className = 'full-chunk-id';
        id.textContent = `${chunk.id} · 원문 ${chunk.source_lines.join(', ')}행`;
        const h3 = document.createElement('h3');
        h3.textContent = chunk.title;
        head.append(id, h3);
        const lines = document.createElement('div');
        lines.className = 'full-chunk-lines';
        lines.replaceChildren(...chunk.rows.map(makeSourceRow));
        article.append(head, lines);
        sectionNode.appendChild(article);
      });
      nodes.push(sectionNode);
    });
    $('fullContent').replaceChildren(...nodes);
    $('fullTitle').textContent = packet.meta.title;
    const audit = packet.audit;
    const mapped = audit.mapped_source_rows ?? audit.mapped_semantic_lines;
    const expected = audit.source_row_count ?? audit.semantic_source_lines ?? audit.topic_semantic_source_lines;
    $('fullCoverage').textContent = `원문 의미 행 ${mapped}/${expected} · 누락 0 · 중복 0`;
  }

  $('homeButton').addEventListener('click', () => showHome());
  $('previousButton').addEventListener('click', () => go(state.index - 1));
  $('nextButton').addEventListener('click', () => go(state.index + 1));
  $('revealButton').addEventListener('click', () => {
    if (!activeTopic) return;
    revealed = !revealed;
    renderAnswer();
  });
  $('redoButton').addEventListener('click', () => mark('redo'));
  $('masterButton').addEventListener('click', () => mark('mastered'));
  $('mobileJump').addEventListener('change', event => go(Number(event.target.value)));
  $('bridgeToggle').addEventListener('click', () => {
    state.bridge = !state.bridge;
    render();
  });
  $('recallTab').addEventListener('click', () => {
    state.view = 'recall';
    renderView();
    persist();
  });
  $('fullTab').addEventListener('click', () => {
    state.view = 'full';
    renderView();
    persist();
  });
  function handleResetClick() {
    if (!activeTopic) return;
    if (!resetArmed) {
      resetArmed = true;
      ['resetProgress', 'mobileResetProgress'].forEach(id => {
        $(id).setAttribute('aria-pressed', 'true');
        $(id).textContent = '한 번 더 눌러 이 주제만 초기화';
      });
      clearTimeout(resetTimer);
      resetTimer = setTimeout(clearResetArm, 3000);
      return;
    }
    state.statuses = {};
    state.index = 0;
    state.view = 'recall';
    revealed = false;
    clearResetArm();
    render();
  }
  $('resetProgress').addEventListener('click', handleResetClick);
  $('mobileResetProgress').addEventListener('click', handleResetClick);
  window.addEventListener('popstate', () => routeFromLocation(true));

  document.addEventListener('keydown', event => {
    if (!activeTopic || event.target.matches('button, select, input, textarea, a')) return;
    if (event.key === 'h' || event.key === 'H' || event.key === 'Escape') showHome();
    else if (event.key === 'ArrowRight') go(state.index + 1);
    else if (event.key === 'ArrowLeft') go(state.index - 1);
    else if (event.code === 'Space' && state.view === 'recall') {
      event.preventDefault();
      $('revealButton').click();
    } else if (event.key === '1' && state.view === 'recall') mark('redo');
    else if (event.key === '2' && state.view === 'recall') mark('mastered');
    else if (event.key === 'f' || event.key === 'F') {
      state.view = state.view === 'recall' ? 'full' : 'recall';
      renderView();
      persist();
    }
  });

  // No query opens the true home; ?topic=<id> opens a shareable deep link.
  routeFromLocation(false);
})();
</script>
</body>
</html>
