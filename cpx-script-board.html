<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CPX 대본 공유보드 · Quick Sheet</title>
<style>
:root {
  --ink:#172033; --muted:#627089; --paper:#fbfcff; --line:#d8dee8; --navy:#254a91; --navy2:#183866;
  --wash:#edf3ff; --soft:#f8fafc; --accent:#eeb85c; --danger:#c0362c; --ok:#16815a;
  --radius:18px; --shadow:0 18px 50px rgba(23,32,51,.12);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Segoe UI',sans-serif;color:var(--ink);background:linear-gradient(135deg,#f5f8ff 0%,#fffaf2 100%);}
button,input,textarea,select{font:inherit}
.app{display:grid;grid-template-columns:290px minmax(390px,520px) 1fr;gap:16px;height:100vh;padding:16px;}
.panel{background:rgba(255,255,255,.86);border:1px solid rgba(216,222,232,.9);border-radius:24px;box-shadow:var(--shadow);min-height:0;overflow:hidden;}
.sidebar{display:flex;flex-direction:column;}
.brand{padding:18px 18px 12px;border-bottom:1px solid var(--line);}
.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);font-weight:900}
h1{font-size:22px;line-height:1.05;margin:6px 0 8px;letter-spacing:-.03em}
.sub{font-size:12px;color:var(--muted);line-height:1.45}
.syncbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;font-size:11px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:999px;background:#94a3b8;display:inline-block;margin-right:6px}.dot.on{background:var(--ok)}.dot.err{background:var(--danger)}
.search{padding:12px 14px;border-bottom:1px solid var(--line)}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;outline:none}
.catwrap{overflow:auto;padding:10px}
.cat{margin-bottom:10px;border-radius:18px;background:#fff;border:1px solid #e5eaf2;overflow:hidden}
.cathead{position:sticky;top:0;background:#fff;z-index:1;padding:10px 12px;font-weight:900;font-size:13px;color:#20314e;display:flex;justify-content:space-between;border-bottom:1px solid #eef2f7}
.cc{width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;display:flex;gap:9px;align-items:flex-start;cursor:pointer;border-bottom:1px solid #f1f4f8;color:#26364e}
.cc:hover{background:var(--soft)}.cc.active{background:var(--wash);color:var(--navy);font-weight:900}
.badge{font-size:10px;font-weight:900;color:var(--navy);background:#e8efff;border:1px solid #d5e2ff;border-radius:999px;padding:3px 6px;flex:none}
.editor{display:flex;flex-direction:column;}
.toolbar{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:space-between;background:rgba(255,255,255,.74)}
.titlebox{min-width:0}.titlebox h2{font-size:19px;margin:0;letter-spacing:-.02em}.titlebox p{margin:3px 0 0;color:var(--muted);font-size:12px}
.btns{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);border-radius:999px;background:#fff;color:#26364e;padding:8px 11px;font-weight:800;font-size:12px;cursor:pointer}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.warn{color:#a05b00;background:#fff8e8}
.form{overflow:auto;padding:14px 16px 28px;display:grid;gap:12px}
.field{display:grid;gap:7px}
.field label{font-size:12px;font-weight:900;color:#354966;display:flex;justify-content:space-between;align-items:center}
.field textarea{width:100%;min-height:92px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:11px 12px;resize:vertical;line-height:1.48;outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.field textarea:focus,.search input:focus{border-color:#9ab0da;box-shadow:0 0 0 3px rgba(37,74,145,.12)}
.field.script textarea{min-height:180px}.hint{font-size:11px;color:var(--muted);font-weight:600}
.previewPanel{padding:12px;overflow:auto;background:#eef3fb;}
.sheet{width:min(100%,794px);min-height:1123px;margin:0 auto;background:#fff;border:1px solid #cdd6e4;box-shadow:0 22px 55px rgba(23,32,51,.18);padding:15px 18px 18px;color:#18212f;}
.sheetHeader{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--navy);padding-bottom:8px;margin-bottom:10px;gap:10px}
.eyebrow{font-size:10px;letter-spacing:.14em;color:var(--navy);font-weight:950}.sheet h2{margin:2px 0 0;font-size:25px;line-height:1.08;letter-spacing:-.04em}
.tag{border:1px solid #c7d4ec;background:#edf3ff;color:var(--navy);border-radius:999px;padding:5px 10px;font-weight:900;font-size:12px;white-space:nowrap}
.card{border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 10px;margin-bottom:8px;break-inside:avoid}
.card.soft{background:var(--soft)}.card h3{font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--navy);margin:0 0 6px;border-bottom:1px solid #e5eaf2;padding-bottom:4px}
.md{font-size:11.2px;line-height:1.43;white-space:pre-wrap}.md p{margin:.28em 0}
.grid2{display:grid;grid-template-columns:1.22fr .9fr;gap:8px}.rightStack{display:grid;gap:0}
.refs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.scriptPreview{font-size:10.5px;line-height:1.38;max-height:210px;overflow:hidden}
.footerNote{margin-top:6px;color:#71809a;font-size:10px;text-align:right}
.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;border-radius:999px;padding:12px 15px;font-weight:800;font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.22s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:1100px){.app{grid-template-columns:260px 1fr;height:auto;min-height:100vh}.previewPanel{grid-column:1/-1}}
@media(max-width:760px){.app{display:block;padding:10px;height:auto}.panel{margin-bottom:12px}.sidebar{max-height:45vh}.sheet{min-height:auto}.grid2,.refs{grid-template-columns:1fr}}
@media print{body{background:#fff}.app{display:block;padding:0;height:auto}.sidebar,.editor{display:none}.previewPanel{display:block;background:#fff;padding:0;overflow:visible}.panel{border:0;box-shadow:none}.sheet{width:210mm;min-height:297mm;margin:0;box-shadow:none;border:0;padding:4mm 4.8mm}@page{size:A4 portrait;margin:3.95mm 4.65mm}}
</style>
</head>

    <div class="brand">
      <div class="kicker">CPX Script Board</div>

      </div>
    </div>
    <div class="form" id="form"></div>
  </main>
  <section class="panel previewPanel"><div id="sheet" class="sheet"></div></section>
</div>

한 기본검사와 추가검사를 단계적으로 안내한다.\n치료: 생활습관, 약물/시술/전원 필요성을 구분해 설명한다.\n안전망: 악화 시 바로 내원해야 할 증상을 알려준다.", "differentials": "1순위 감별: 실제 CPX에서 자주 나오는 흔한 원인\n위험 감별: 놓치면 안 되는 응급/중증 원인\n기능성/생활습관 원인: 검사 이상이 없을 때 설명할 축\n약물/가족력/여성력 관련 원인: 해당 시 반드시 확인", "coreDiseases": "핵심 질환 표를 여기에 정리한다.\n질환명 | 감별 포인트 | 진단 | 치료/교육 순서로 짧게 쓴다.", "script": "의사: 안녕하세요. 어떤 점이 가장 불편해서 오셨나요?\n환자: ...\n의사: 먼저 증상이 언제부터 시작됐는지, 어떤 상황에서 심해지는지 확인하겠습니다.\n의사: 위험 신호를 확인한 뒤 필요한 진찰과 검사를 설명드리겠습니다.", "references": "한끝 CPX / 알렌 CPX / 국시원 평가목표 / 개인 대본"}, "12": {"overview": "먼저 확인: 검사 결과를 가져온 경우 검사 자체가 제대로 이루어졌는지부터 확인한다. 검사 시점, 공복 여부, 전날 과음·고지방식 여부, 총콜레스테롤/LDL/HDL/TG 수치를 함께 본다.\n\n첫 갈래: 일차성 이상지질혈증 vs 이차성 원인으로 나누고, 동시에 심혈관 위험도와 가족성 여부를 평가한다.\n\n이차성 원인: 갑상샘저하증, 쿠싱증후군, 당뇨병, 신증후군/만성신질환, 약물.\n위험 인자: 고혈압, 당뇨병, 흡연, 복부비만, 조기 관상동맥질환 가족력.", "history": "O: 언제 검사했는지, 총콜레스테롤/LDL/HDL/TG 수치 확인\nCo: 검사 전 과음/과식 여부, 9~12시간 공복 여부\nEx: 이전 이상지질혈증 진단/약 복용력, 약 복용 후 조절 여부\nC: 키, 몸무게, 허리둘레\nA: 체중 변화, 피로, 추위불내성, 변비, 다음/다뇨/다갈, 거품뇨, 흉통/호흡곤란/어지럼\n약: 피임약, 호르몬, 스테로이드, thiazide, beta blocker\n사: 술, 담배, 식습관, 운동량\n가: 고지혈증/심혈관질환 가족력, 남자 55세 미만/여자 65세 미만 조기 관상동맥질환", "pe": "V/S: 혈압, 맥박, 호흡수, 체온\n체형: 키, 체중, 허리둘레, BMI\n눈: xanthelasma, 결막, 공막\n목: 갑상샘 촉진, 경동맥 청진\n가슴: 심음 청진\n피부: xanthoma 시진, 특히 손바닥·팔꿈치·발목·아킬레스건\n복부: 복부비만, 간비대, 자색선조\n다리: 하지부종", "education": "PPI: 지질 수치가 높게 나와 걱정이 많이 되셨을 것 같습니다.\n검사: 간·신장·갑상샘 기능검사, 혈당검사로 이차성 원인을 확인한다.\n치료: 생활습관 교정과 필요 시 스타틴 치료.\n예후: 이상지질혈증은 심혈관계 합병증 위험을 높이므로 지금부터 관리해야 예방 가능하다.\n교육: 규칙적 식사, 저지방식, 지나친 당질/동물성 지방 제한, 유산소 운동, 체중 감량, 목표 LDL 수치 설명.\n약물: 스타틴 부작용으로 근육통과 간수치 상승 가능성을 설명한다.", "differentials": "원발성 이상지질혈증: 반복 검사에서도 지속, 뚜렷한 이차성 원인 없음\n대사증후군 동반 이상지질혈증: 복부비만, 고혈압, 당뇨병, 낮은 HDL/높은 TG\n알코올 유발 고중성지방혈증: 과음 후 악화, TG 중심 상승\n가족성 고콜레스테롤혈증: 젊은 나이, 가족력, xanthelasma/xanthoma, 조기 심혈관질환 가족력\n신증후군/갑상샘저하증/쿠싱증후군/당뇨병/약물유발 이상지질혈증 배제", "coreDiseases": "LDL-C 목표: 관상동맥질환은 매우 낮게, 고위험군일수록 더 낮게 잡는다.\n고 HDL-C는 보호인자로 보아 위험 인자 수에서 1개를 감할 수 있다.\n생활습관 질문은 비난하지 말고 문진에서 듣고, 교육 단계에서 교정한다.", "script": "의사: 검사 결과가 걱정돼서 오셨군요. 우선 이 검사가 어떤 상태에서 시행됐는지부터 확인하겠습니다.\n환자: 네, 건   document.getElementById('countText').textContent=`${state.topics.length} CC`;
  wrap.innerHTML = state.categories.map(cat=>{
    const arr=state.topics.filter(t=>t.cat===cat).filter(t=>!q || t.title.toLowerCase().includes(q) || String(t.id).includes(q) || cat.toLowerCase().includes(q));
    if(!arr.length) return '';
    return `<section class="cat"><div class="cathead"><span>${esc(cat)}</span><span>${arr.length}</span></div>${arr.map(t=>`<button class="cc ${String(t.id)===String(selectedId)?'active':''}" data-id="${t.id}"><span class="badge">${t.id}</span><span>${esc(t.title)}</span></button>`).join('')}</section>`;
  }).join('');
  wrap.querySelectorAll('.cc').forEach(btn=>btn.addEventListener('click',()=>{ selectedId=btn.dataset.id; saveLocal(); renderAll(); }));
}
function renderForm(){
  const t=currentTopic(), s=currentScript();
  document.getElementById('editTitle').textContent=t.title;
  document.getElementById('editSub').textContent=`${t.cat} · CC ID ${t.id} · v12 PDF 스타일`;
  document.getElementById('form').innerHTML = FIELDS.map(([key,label,hint])=>`<div class="field ${key==='script'?'script':''}"><label for="f_${key}"><span>${label}</span><span class="hint">${hint}</span></label><textarea id="f_${key}" data-key="${key}">${esc(s[key]||'')}</textarea></div>`).join('');
  document.querySelectorAll('textarea[data-key]').forEach(el=>el.addEventListener('input',()=>{ currentScript()[el.dataset.key]=el.value; saveLocal(); renderSheet(); schedulePush(); }));
}
function renderSheet(){
  const t=currentTopic(), s=currentScript(); const title=esc(t.title.replace(/^\d+(?:-\d+)?\.\s*/,''));
  document.getElementById('sheet').innerHTML = `<header class="sheetHeader"><div><div class="eyebrow">CPX QUICK SHEET</div><h2>${esc(t.title)}</h2></div><div class="tag">${esc(t.cat)} · Script Share</div></header>
  <section class="card soft"><h3>개요</h3><div class="md">${md(s.overview)}</div></section>
  <div class="grid2"><section class="card"><h3>History taking</h3><div class="md">${md(s.history)}</div></section><div class="rightStack"><section class="card"><h3>PE</h3><div class="md">${md(s.pe)}</div></section><section class="card"><h3>검사 · 치료 · 교육</h3><div class="md">${md(s.education)}</div></section></div></div>
  <div class="refs"><section class="card soft"><h3>Differential diagnosis</h3><div class="md">${md(s.differentials)}</div></section><section class="card soft"><h3>핵심 질환 / 참고표</h3><div class="md">${md(s.coreDiseases)}</div></section></div>
  <section class="card"><h3>대본 미리보기</h3><div class="md scriptPreview">${md(s.script)}</div></section><div class="footerNote">${esc(s.references||'')} · updated ${new Date(state.updatedAt||Date.now()).toLocaleString('ko-KR')}</div>`;
}
function renderAll(){ renderList(); renderForm(); renderSheet(); }
function copyText(){ const t=currentTopic(), s=currentScript(); const body = `# ${t.title} CPX 대본

## 개요
${s.overview}

## History taking
${s.history}

## PE
${s.pe}

## 검사/치료/교육
${s.education}

## Differential diagnosis
${s.differentials}

## 핵심 질환
${s.coreDiseases}

## 대본
${s.script}

## 출처/메모
${s.references||''}`; navigator.clipboard.writeText(body).then(()=>toast('복사용 텍스트를 복사했어')); }
function exportJson(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='cpx-script-board-backup.json'; a.click(); URL.revokeObjectURL(a.href); toast('JSON 백업을 내려받았어'); }
async function initSupabase(){
  try{ const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'); supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}); setSync('Supabase 연결 중','');
    await pullRemote(false);
    realtime = supabase.channel(`cpx-script-board-${USER_ID}`).on('postgres_changes', {event:'*', schema:'public', table:'planner_user_state', filter:`user_id=eq.${USER_ID}`}, payload=>{ if(payload?.new?.updated_by===deviceId) return; pullRemote(true); }).subscribe(status=>{ if(status==='SUBSCRIBED') setSync('Realtime 연결됨','on'); });
  }catch(e){ console.error(e); setSync('Supabase 오류','err'); }
}
async function pullRemote(show){ if(!supabase) return; const {data,error}=await supabase.rpc('planner_user_state_pull', {p_user_id:USER_ID}); if(error) throw error; const row=data?.[0]; if(row?.state_json){ const remote=row.state_json; const remoteTime=Date.parse(row.updated_at||remote.updatedAt||0); const localTime=Date.parse(state.updatedAt||0); if(remoteTime>localTime){ remoteApplying=true; state={...defaultState(), ...remote}; selectedId=state.selectedId || selectedId; saveLocal(); renderAll(); remoteApplying=false; if(show) toast('다른 기기 수정사항을 반영했어'); } } else { await pushRemote('초기 생성'); } }
async function pushRemote(reason='저장'){ if(!supabase){ toast('Supabase가 아직 연결되지 않았어'); return; } saveLocal(); const payload={...state, updatedAt:new Date().toISOString(), updatedBy:deviceId}; const {error}=await supabase.rpc('planner_user_state_push', {p_user_id:USER_ID, p_state_json:payload, p_state_version:STATE_VERSION, p_updated_by:deviceId, p_updated_at:payload.updatedAt}); if(error){ console.error(error); setSync('저장 실패','err'); toast('Supabase 저장 실패'); return; } state=payload; saveLocal(); setSync('Realtime 연결됨','on'); toast(`${reason} 완료`); }
function schedulePush(){ if(remoteApplying) return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>pushRemote('자동 저장'),1300); }
document.getElementById('search').addEventListener('input',e=>{ filter=e.target.value; renderList(); });
document.getElementById('copyBtn').addEventListener('click',copyText);
document.getElementById('exportBtn').addEventListener('click',exportJson);
document.getElementById('printBtn').addEventListener('click',()=>window.print());
document.getElementById('saveBtn').addEventListener('click',()=>pushRemote('수동 저장'));
renderAll(); initSupabase();
</script>
</body>
</html>
