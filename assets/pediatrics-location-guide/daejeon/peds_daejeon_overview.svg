<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .bg{fill:#f8fbff} .card{fill:#fff;stroke:#cbd5e1;stroke-width:3;rx:24} .title{font:800 42px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;fill:#0f172a} .sub{font:600 24px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;fill:#475569} .txt{font:600 22px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;fill:#334155} .small{font:500 18px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;fill:#64748b} .pill{fill:#e0f2fe;stroke:#38bdf8;stroke-width:2;rx:18} .hot{fill:#fee2e2;stroke:#ef4444;stroke-width:2;rx:18} .ok{fill:#dcfce7;stroke:#22c55e;stroke-width:2;rx:18} .warn{fill:#fef3c7;stroke:#f59e0b;stroke-width:2;rx:18} .line{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="760"/>
  
  <text class="title" x="60" y="78">대전 본원 소아청소년과 동선 지도</text>
  <text class="sub" x="60" y="120">실습 시작점은 소아동 2층 의국. 병동/NICU/외래를 하루 단위로 오간다.</text>
  <rect class="card ok" x="70" y="175" width="310" height="140"/><text class="sub" x="105" y="225">소아동 2층 의국</text><text class="txt" x="105" y="265">프테 · OT · 집담회</text><text class="small" x="105" y="294">CPX/피드백/마감 대기</text>
  <rect class="card warn" x="445" y="175" width="310" height="140"/><text class="sub" x="485" y="225">소아동 3층 NICU</text><text class="txt" x="485" y="265">신생아 OT · NBS</text><text class="small" x="485" y="294">POMR · 분만/C-sec 참관</text>
  <rect class="card hot" x="820" y="175" width="310" height="140"/><text class="sub" x="850" y="225">소아동 4층 341병동</text><text class="txt" x="850" y="265">병원학교 · 회진</text><text class="small" x="850" y="294">혈종/감염 병동 POMR</text>
  <path class="line" d="M380 245 H440"/><path class="line" d="M755 245 H815"/>
  <rect class="card" x="70" y="400" width="1060" height="230"/><text class="sub" x="105" y="450">외래 구역</text><text class="txt" x="105" y="500">1번방: 정은희/양은애 · 2번방: 신경 · 3번방: 감염/소화기 · 4번방: 내분비</text><text class="txt" x="105" y="545">6번방: 강미현 · 7번방: 임연정 혈종 · 8번방: 배은영 심장</text><text class="small" x="105" y="595">방 번호는 공식표와 최신 인계가 충돌할 수 있어 집담회 직후/외래 전 당일 확인.</text>

</svg>